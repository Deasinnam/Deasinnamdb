<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>이음오피스</title>
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <header>
    <h1>이음오피스</h1>
    <p class="sub">안드로이드판 · 미리보기</p>
  </header>

  <main>
    <button id="open" class="primary">파일 열기</button>

    <section>
      <h2>새로 만들기</h2>
      <div class="grid">
        <button class="tile" data-new="hwp"><span class="badge hwp">HWP</span>한글 문서</button>
        <button class="tile" data-new="markdown"><span class="badge md">MD</span>마크다운</button>
        <button class="tile" data-new="html"><span class="badge html">HTML</span>웹 문서</button>
      </div>
    </section>

    <section>
      <h2>최근 문서</h2>
      <ul id="recent"><li class="empty">아직 연 문서가 없습니다</li></ul>
    </section>

    <section class="note">
      <h2>지원 형식</h2>
      <p><b>열기·편집·저장</b>: 한글(.hwp, .hwpx), 마크다운(.md), HTML</p>
      <p><b>보기</b>: PDF</p>
      <p class="muted">워드·엑셀·파워포인트·EPUB·마인드맵·다이어그램은 다음 버전에서 옮길 예정입니다.</p>
    </section>
  </main>

  <footer>
    <a href="../licenses/NOTICE.txt">오픈소스 고지</a> ·
    <a href="../licenses/LICENSE.txt">Apache-2.0</a>
    <p class="muted">IeumOffice(pblsketch) 0.12.12를 안드로이드로 옮긴 비공식 빌드입니다.</p>
  </footer>

  <div id="toast"></div>
  <script src="./home.js"></script>
</body>
</html>
