<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>대신남 워크 · 문서</title>
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <header>
    <h1>대신남 워크 · 문서</h1>
    <p class="sub">워드 · 엑셀 · 파워포인트 · 한글 · PDF</p>
  </header>

  <main>
    <button id="open" class="primary">파일 열기</button>

    <section>
      <h2>새로 만들기</h2>
      <div class="grid">
        <button class="tile" data-new="docs"><span class="badge doc">DOC</span>워드</button>
        <button class="tile" data-new="sheets"><span class="badge xls">XLS</span>엑셀</button>
        <button class="tile" data-new="slides"><span class="badge ppt">PPT</span>파워포인트</button>
        <button class="tile" data-new="hwp"><span class="badge hwp">HWP</span>한글 문서</button>
        <button class="tile" data-new="mindmap"><span class="badge map">MAP</span>마인드맵</button>
        <button class="tile" data-new="diagram"><span class="badge dia">DIA</span>다이어그램</button>
        <button class="tile" data-new="markdown"><span class="badge md">MD</span>마크다운</button>
        <button class="tile" data-new="html"><span class="badge html">HTML</span>웹 문서</button>
      </div>
    </section>

    <section>
      <h2>최근 문서</h2>
      <ul id="recent"><li class="empty">아직 연 문서가 없습니다</li></ul>
    </section>

    <section class="note">
      <h2>지원 형식</h2>
      <p><b>열기·편집·저장</b>: 워드(.docx), 엑셀(.xlsx·.xls·.csv), 파워포인트(.pptx), 한글(.hwp·.hwpx), EPUB, 마인드맵(.xmind), 다이어그램(.drawio), 마크다운, HTML</p>
      <p><b>보기</b>: PDF</p>
      <p class="muted" id="engine"></p>
    </section>
  </main>

  <footer>
    <p class="muted">문서 편집은 오픈소스 IeumOffice(pblsketch, Apache-2.0)를 고쳐 만들었습니다.
      <a href="../licenses/NOTICE.txt">고지</a> · <a href="../licenses/LICENSE.txt">라이선스</a></p>
  </footer>

  <div id="toast"></div>
  <script src="./home.js"></script>
</body>
</html>
