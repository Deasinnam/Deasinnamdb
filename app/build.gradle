plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.amp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.amp'
        minSdk 26
        targetSdk 35
        versionCode 42
        versionName "6.2"
    }

    buildFeatures { buildConfig true }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값(Secrets)에서 키를 꺼내 환경 변수로 넘깁니다.
    // 업데이트할 때마다 같은 키로 서명해야 덮어 설치가 됩니다.
    def ampKeystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        amp {
            if (ampKeystore) {
                storeFile file(ampKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    // lite: 알림 접근 권한 없음. Play 프로텍트에 막히지 않고 설치됩니다.
    // full: 알림 접근 권한으로 모든 앱의 곡 정보·탐색까지 지원합니다. Play 프로텍트가 설치를 막을 수 있습니다.
    flavorDimensions 'edition'
    productFlavors {
        lite { dimension 'edition' }
        full { dimension 'edition'; versionNameSuffix '-full' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 키가 없으면(로컬 빌드) 서명하지 않은 APK를 만듭니다.
            if (ampKeystore) signingConfig signingConfigs.amp
        }
    }

    lint {
        // Media3의 실험 API(@UnstableApi)를 쓰므로 해당 검사는 끕니다.
        disable 'UnsafeOptInUsageError'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
}
