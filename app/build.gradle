plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.ieum'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.ieum'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.12.12-android.1"
    }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값(Secrets)에서 키를 꺼내 환경 변수로 넘깁니다.
    // (Daesinnam Amp와 같은 키·같은 비밀값 이름을 씁니다.)
    def keystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        daesinnam {
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.daesinnam
        }
    }

    androidResources {
        // 편집기 엔진(wasm·js)은 이미 압축돼 있지 않으므로 기본 압축은 그대로 두되,
        // aapt 기본 규칙이 밑줄(_)로 시작하는 폴더를 빼 버리지 않도록 무시 규칙을 줄입니다.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
}
