plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.tv'
        minSdk 30
        targetSdk 35
        versionCode 14
        versionName "0.8.2"
    }

    buildFeatures { buildConfig true }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값에서 꺼내 씁니다 (다른 덜누름 앱과 같은 키).
    def keystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        daesinnam {
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.daesinnam
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 고급 기능: Shizuku (사용자가 따로 설치한 Shizuku 앱과 연결) — DeX에서 확실한 전체 화면
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation('org.lsposed.hiddenapibypass:hiddenapibypass:4.3') { exclude group: 'com.google.errorprone' }
}
