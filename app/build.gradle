plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.pad'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.pad'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "0.2.1"
    }

    buildFeatures { buildConfig true }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값에서 꺼내 씁니다 (다른 덜누름 앱과 같은 키).
    def keystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        daesinnam {
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.daesinnam
        }
    }

    lint {
        checkOnly 'NewApi'
        abortOnError false
        checkReleaseBuilds false
        textReport true
        textOutput file('lint-newapi.txt')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
