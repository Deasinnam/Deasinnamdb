plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.amp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.amp'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "2.10"
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        // 업데이트할 때마다 같은 키로 서명해야 덮어 설치가 됩니다.
        amp {
            storeFile rootProject.file('signing/amp.keystore')
            storePassword 'DaesinnamAmp2026'
            keyAlias 'amp'
            keyPassword 'DaesinnamAmp2026'
        }
    }

    // lite: 알림 접근 권한 없음. Play 프로텍트에 막히지 않고 설치됩니다.
    // full: 알림 접근 권한으로 모든 앱의 곡 정보·탐색까지 지원합니다. Play 프로텍트가 설치를 막을 수 있습니다.
    flavorDimensions 'edition'
    productFlavors {
        lite { dimension 'edition' }
        full { dimension 'edition'; versionNameSuffix '-full' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.amp
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
