plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.desk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.desk'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildFeatures { buildConfig true }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값에서 꺼내 씁니다 (다른 대신남 앱과 같은 키).
    def keystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        daesinnam {
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.daesinnam
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
}
