plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.amp'
    compileSdk 36

    defaultConfig {
        // 대신남 원 Ver1: 기존 앱·데모판과 패키지 이름이 달라 덮어쓰지 않고 따로 설치됩니다(백업·비교 테스트용).
        applicationId 'com.daesinnam.one.v1'
        minSdk 26
        targetSdk 36  // 1.52 구글 플레이: 2026-08-31부터 새 앱은 API 36 이상
        versionCode 101
        versionName "1.67-one"
    }

    buildFeatures { buildConfig true }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값(Secrets)에서 키를 꺼내 환경 변수로 넘깁니다.
    // 업데이트할 때마다 같은 키로 서명해야 덮어 설치가 됩니다.
    def ampKeystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        amp {
            if (ampKeystore) {
                storeFile file(ampKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    // lite: 알림 접근 권한 없음. Play 프로텍트에 막히지 않고 설치됩니다.
    // full: 알림 접근 권한으로 모든 앱의 곡 정보·탐색까지 지원합니다. Play 프로텍트가 설치를 막을 수 있습니다.
    // device: std(일반 휴대폰·태블릿) / fold8(갤럭시 Z 폴드8 전용, 보라색, 패키지 이름이 달라 따로 설치됨)
    flavorDimensions 'device', 'edition'
    productFlavors {
        std { dimension 'device' }
        fold8 { dimension 'device'; applicationIdSuffix '.fold8'; versionNameSuffix '-fold8' }
        // 1.53 기존 대신남 원과 따로 설치되는 시험판 두 가지(이름·패키지가 다름)
        // comm: 대신남 배포용 테스트(커뮤니티 무료 배포) / play: 대신남 원 안드로이드 테스트용(구글 플레이 등록 준비)
        comm { dimension 'device'; applicationId 'com.daesinnam.dist.test'; versionNameSuffix '-dist-test' }
        play { dimension 'device'; applicationId 'com.daesinnam.one.androidtest'; versionNameSuffix '-play-test' }
        // 1.55 앱 나누기 — 기존 앱(com.daesinnam.one.v1)과 따로 설치되는 독립 앱 두 개
        // amp: 대신남 AMP(음악 전용, 오디오 스킨 7개) / one: 대신남 원(차량용, 자동차 모드·에어라인)
        amp { dimension 'device'; applicationId 'com.daesinnam.ampapp'; versionNameSuffix '-amp' }
        one { dimension 'device'; applicationId 'com.daesinnam.oneapp'; versionNameSuffix '-one' }
        // 스페셜: 대신남 원과 같은 차량용 구성 + 지브리풍 고품질 PFD 풍경(하늘·구름·땅·강·바다). 기존 앱과 따로 설치되는 새 앱
        special { dimension 'device'; applicationId 'com.daesinnam.specialapp'; versionNameSuffix '-special' }
        lite { dimension 'edition' }
        full { dimension 'edition'; versionNameSuffix '-full' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 키가 없으면(로컬 빌드) 서명하지 않은 APK를 만듭니다.
            if (ampKeystore) signingConfig signingConfigs.amp
        }
    }

    lint {
        // Media3의 실험 API(@UnstableApi)를 쓰므로 해당 검사는 끕니다.
        disable 'UnsafeOptInUsageError'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
}
