plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.amp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.amp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 서명 키 없이도 설치 가능하도록 디버그 키로 서명합니다.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
