plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.browser'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName "2.1"
    }

    buildFeatures { buildConfig true }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값에서 꺼내 씁니다 (다른 덜누름 앱과 같은 키).
    def keystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        daesinnam {
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // 쓰지 않는 코드를 덜어내 앱을 작게 (라이브러리는 필요한 부분만 남음)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystore) signingConfig signingConfigs.daesinnam
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
