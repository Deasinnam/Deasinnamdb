plugins { id 'com.android.application' }

android {
    namespace 'com.daesinnam.work'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daesinnam.work'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
        // 넣을 CPU 종류: 기본은 휴대폰용 arm64. 에뮬레이터 시험 빌드는 -PworkAbis=arm64-v8a,x86_64
        ndk { abiFilters.addAll((project.findProperty('workAbis') ?: 'arm64-v8a').toString().split(',')) }
    }

    packaging {
        // node(libnode.so)·엑셀 엔진(libxlsxsidecar.so)을 실행 파일로 쓰려면 설치할 때 풀려 있어야 합니다
        jniLibs { useLegacyPackaging = true }
    }

    // 서명 키는 저장소에 두지 않습니다. CI가 GitHub 비밀값(Secrets)에서 키를 꺼내 환경 변수로 넘깁니다.
    // (Daesinnam Amp와 같은 키·같은 비밀값 이름을 씁니다.)
    def keystore = System.getenv('AMP_KEYSTORE_FILE')
    signingConfigs {
        daesinnam {
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('AMP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMP_KEY_ALIAS') ?: 'amp'
                keyPassword System.getenv('AMP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.daesinnam
        }
    }

    androidResources {
        // 편집기 엔진(wasm·js)은 이미 압축돼 있지 않으므로 기본 압축은 그대로 두되,
        // aapt 기본 규칙이 밑줄(_)로 시작하는 폴더를 빼 버리지 않도록 무시 규칙을 줄입니다.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress 'zip', 'part-aa', 'part-ab', 'part-ac', 'part-ad'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // androidx 라이브러리들이 서로 다른 kotlin-stdlib 버전을 끌고 와 클래스가 겹치지 않게 맞춥니다.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
