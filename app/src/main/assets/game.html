<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>대신남 로드 디펜스</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b3d6b;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#fff;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;gap:8px;align-items:center;pointer-events:none;font-weight:800}
  .chip{background:rgba(0,0,0,.45);border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
  .chip b{color:#ffd54a}
  .hpwrap{flex:1;height:14px;background:rgba(0,0,0,.45);border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.35)}
  .hp{height:100%;width:100%;background:linear-gradient(#7be36f,#3aa832);transition:width .2s}
  .pausebtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;font-weight:900}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,20,40,.72);padding:20px}
  .overlay.show{display:flex}
  .panel{width:100%;max-width:420px;background:linear-gradient(#1f5f9e,#123c69);border:3px solid #ffd54a;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .panel h1{margin:0 0 4px;font-size:34px;letter-spacing:1px;text-shadow:0 3px 0 #0a2540}
  .panel h2{margin:0 0 10px;font-size:28px;text-shadow:0 3px 0 #0a2540}
  .panel p{margin:6px 0 14px;opacity:.9;line-height:1.5;font-size:15px}
  .btn{display:block;width:100%;margin:10px 0 0;padding:14px;border:0;border-radius:14px;font-size:19px;font-weight:900;color:#3b2500;background:linear-gradient(#ffe27a,#f5b52a);box-shadow:0 4px 0 #a86f00}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86f00}
  .btn.blue{color:#fff;background:linear-gradient(#5aa9ff,#2f74d0);box-shadow:0 4px 0 #1a4a8c}
  .btn.gray{color:#fff;background:linear-gradient(#8a97a8,#5d6878);box-shadow:0 4px 0 #3a4350}
  .gold{color:#ffd54a;font-weight:900}
  .shop{display:grid;gap:8px;margin:8px 0 4px;text-align:left}
  .item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px}
  .item .ic{font-size:26px;width:34px;text-align:center}
  .item .tx{flex:1;font-size:14px;line-height:1.3}
  .item .tx b{font-size:15px}
  .item button{border:0;border-radius:10px;padding:8px 10px;min-width:78px;font-weight:900;font-size:14px;color:#3b2500;background:linear-gradient(#ffe27a,#f5b52a)}
  .item button:disabled{background:#556;color:#aab}
  .help{font-size:13px;text-align:left;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud" style="display:none">
  <div class="chip">스테이지 <b id="hStage">1</b></div>
  <div class="hpwrap"><div class="hp" id="hHp"></div></div>
  <div class="chip">🪙 <b id="hGold">0</b></div>
  <button class="pausebtn" id="pauseBtn">Ⅱ</button>
</div>

<div class="overlay show" id="oTitle"><div class="panel">
  <h1>대신남 로드</h1>
  <p style="margin-top:0">— 다리 위 방어전 —</p>
  <div class="help">
    👆 화면을 좌우로 끌면 영웅이 움직여요<br>
    🏹 화살로 <b style="color:#7cc4ff">게이트</b>를 쏘면 숫자가 커져요<br>
    🔢 게이트를 지나면 병력이 늘어나요 (+, ×)<br>
    ⚔️ 병력으로 <b style="color:#ff7a7a">적 부대</b>를 막으세요<br>
    🏰 놓친 적은 성벽을 공격해요
  </div>
  <button class="btn" id="bStart">게임 시작</button>
  <button class="btn blue" id="bShop1">🛒 강화 상점</button>
  <button class="btn gray" id="bReset">처음부터 다시</button>
</div></div>

<div class="overlay" id="oPause"><div class="panel">
  <h2>일시정지</h2>
  <button class="btn" id="bResume">계속하기</button>
  <button class="btn gray" id="bQuit">타이틀로</button>
</div></div>

<div class="overlay" id="oResult"><div class="panel">
  <h2 id="rTitle">승리!</h2>
  <p id="rText"></p>
  <button class="btn" id="bNext">다음 스테이지</button>
  <button class="btn blue" id="bShop2">🛒 강화 상점</button>
  <button class="btn gray" id="bTitle">타이틀로</button>
</div></div>

<div class="overlay" id="oShop"><div class="panel">
  <h2>강화 상점</h2>
  <div>보유 골드 <span class="gold">🪙 <span id="sGold">0</span></span></div>
  <div class="shop" id="shopList"></div>
  <button class="btn" id="bShopClose">닫기</button>
</div></div>

<script>
'use strict';
// ───────── 저장 ─────────
const SAVE_KEY = 'dsn_lords_v1';
const UPG = [
  {id:'dmg',   ic:'🏹', name:'화살 공격력', desc:l=>`화살 한 발 피해 ${1+l}`,          base:30,  max:30},
  {id:'rate',  ic:'⚡', name:'연사 속도',   desc:l=>`초당 ${(1/fireInterval(l)).toFixed(1)}발`, base:40, max:20},
  {id:'multi', ic:'🎯', name:'멀티샷',     desc:l=>`한 번에 ${1+l}발`,               base:150, max:4},
  {id:'troop', ic:'🛡️', name:'시작 병력',   desc:l=>`시작 병력 ${5+l*5}`,             base:25,  max:40},
  {id:'wall',  ic:'🏰', name:'성벽 체력',   desc:l=>`성벽 체력 ${100+l*50}`,          base:35,  max:30},
];
function fireInterval(l){ return 0.30*Math.pow(0.9,l); }
let save = {stage:1, gold:0, lv:{dmg:0,rate:0,multi:0,troop:0,wall:0}, best:1};
try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s && s.lv) save = Object.assign(save, s, {lv:Object.assign(save.lv, s.lv)}); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
function cost(u){ return Math.floor(u.base*Math.pow(1.55, save.lv[u.id])); }

// ───────── 네이티브 연결 ─────────
const Native = window.AndroidGame || null;
function buzz(ms){ try{ if(Native) Native.vibrate(ms); else if(navigator.vibrate) navigator.vibrate(ms);}catch(e){} }

// ───────── 소리 ─────────
let AC = null;
function audioInit(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
function tone(f, d, type='square', vol=0.05, slide=0){
  if(!AC) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide), t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);
}
const sfx = {
  shoot(){ tone(880,0.05,'triangle',0.015,-300); },
  gateUp(){ tone(1200,0.04,'square',0.02); },
  gain(){ tone(520,0.12,'triangle',0.06,500); },
  loss(){ tone(300,0.18,'sawtooth',0.05,-150); },
  clash(){ tone(140,0.15,'sawtooth',0.06,-60); },
  wall(){ tone(90,0.25,'square',0.07,-40); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.07),i*110)); },
  lose(){ [392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sawtooth',0.05),i*160)); },
};

// ───────── 캔버스 ─────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR=1, SC=1, VW=360, VH=640, ROAD_L=30, ROAD_W=300, LANE_W=100, HERO_Y=520, WALL_Y=580;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w*DPR); cv.height = Math.round(h*DPR);
  SC = Math.min(w/360, h/600);
  VW = w/SC; VH = h/SC;
  ROAD_W = 300; ROAD_L = (VW-ROAD_W)/2; LANE_W = ROAD_W/3;
  WALL_Y = VH - 62; HERO_Y = WALL_Y - 70;
  if(G) G.hero.x = clamp(G.hero.x, ROAD_L+14, ROAD_L+ROAD_W-14);
}
addEventListener('resize', resize);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a), irnd=(a,b)=>Math.floor(rnd(a,b+1));

// 병사 대형(해바라기 배치)
const FORM = []; for(let i=0;i<160;i++){ const r=5.2*Math.sqrt(i+1), a=i*2.39996; FORM.push([Math.cos(a)*r*1.25, Math.sin(a)*r*0.7+r*0.35]); }

// ───────── 게임 상태 ─────────
let G = null, state = 'title', last = 0;

function newGame(){
  const s = save.stage;
  G = {
    stage:s, t:0, spawnT:0.6, rowsLeft: 12 + s*2, bossSpawned:false, bossDone:false,
    speed: 52 + Math.min(40, s*2.2),
    hero:{x: ROAD_L+ROAD_W/2, fireT:0, bob:0},
    troops: 5 + save.lv.troop*5,
    wallMax: 100 + save.lv.wall*50, wall: 100 + save.lv.wall*50,
    objs:[], arrows:[], fx:[], texts:[], shake:0, kills:0, goldEarned:0, scroll:0,
    lastEnemyLane:-1,
  };
  updateHud();
}

function spawnRow(){
  const s = G.stage, prog = 1 - G.rowsLeft/(12+s*2);
  const lanes = [0,1,2];
  // 한 줄에 적은 최대 2칸, 게이트 최소 1칸
  let kinds = lanes.map(()=>{ const r=Math.random(); return r<0.42?'enemy': r<0.85?'gate':'none'; });
  if(kinds.every(k=>k==='enemy')) kinds[irnd(0,2)]='gate';
  if(!kinds.includes('gate') && Math.random()<0.7) kinds[kinds.indexOf('none')>=0?kinds.indexOf('none'):irnd(0,2)]='gate';
  kinds.forEach((k,i)=>{
    const x = ROAD_L + i*LANE_W + 6, w = LANE_W-12;
    if(k==='enemy'){
      const n = Math.round((4 + s*2.8) * rnd(0.7,1.3) * (1+prog*0.8));
      G.objs.push({type:'enemy', x, w, y:-60, h:46, n, n0:n, done:false});
    } else if(k==='gate'){
      const r = Math.random();
      let op, v;
      if(r < 0.15 + Math.min(0.1, s*0.01)){ op='x'; v=2; }
      else if(r < 0.70){ op='+'; v=irnd(1, 3+Math.floor(s*1.2)); }
      else { op='-'; v=-irnd(2, 4+Math.floor(s*1.5)); }
      G.objs.push({type:'gate', op, v, hits:0, x, w, y:-40, h:34, done:false, flash:0});
    }
  });
}

function spawnBoss(){
  const s = G.stage, hp = Math.round(40 + s*28 + s*s*3);
  G.objs.push({type:'boss', x:ROAD_L+6, w:ROAD_W-12, y:-110, h:90, n:hp, n0:hp, done:false, flash:0});
  addText(VW/2, VH*0.35, '⚠ 보스 등장!', '#ff5a5a', 30, 1.6);
  sfx.wall(); buzz(80);
}

function addText(x,y,s,c,size=22,life=0.9){ G.texts.push({x,y,s,c,size,life,t:0}); }
function burst(x,y,c,n=8,sp=120){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=rnd(sp*0.3,sp); G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.3,0.6),t:0,c,r:rnd(1.5,3.2)}); } }

function heroOverlap(o){ const hx=G.hero.x; return hx > o.x-10 && hx < o.x+o.w+10; }

function fight(o){
  const before = G.troops;
  if(G.troops >= o.n){ G.troops -= Math.ceil(o.n); G.kills += Math.ceil(o.n); o.n = 0; o.done = true; }
  else { o.n -= G.troops; G.kills += G.troops; G.troops = 0; }
  const lost = before - G.troops;
  if(lost>0){ addText(G.hero.x, HERO_Y-30, '-'+lost, '#ff6b6b', 24); burst(G.hero.x, HERO_Y-10, '#ff4d4d', 16, 160); sfx.clash(); buzz(30); }
}

function applyGate(o){
  o.done = true; const before = G.troops;
  if(o.op==='x') G.troops = Math.max(G.troops*o.v, G.troops);
  else G.troops = Math.max(0, G.troops + o.v);
  const d = G.troops - before;
  if(o.op==='x'){ addText(G.hero.x, HERO_Y-40, '×'+o.v+'!', '#ffd54a', 30); sfx.gain(); buzz(25); }
  else if(d>=0){ addText(G.hero.x, HERO_Y-40, '+'+d, '#7cf07c', 28); sfx.gain(); }
  else { addText(G.hero.x, HERO_Y-40, ''+d, '#ff6b6b', 28); sfx.loss(); buzz(40); }
  burst(o.x+o.w/2, o.y+o.h/2, o.op==='-'?'#ff6b6b':'#8fd3ff', 18, 180);
}

function hitGate(o){
  o.hits++; o.flash = 0.08;
  if(o.op==='x'){ if(o.hits % 6 === 0 && o.v < 5){ o.v++; sfx.gateUp(); } }
  else { o.v += 1; if(o.v>0 && o.op==='-') o.op='+'; sfx.gateUp(); }
}

function update(dt){
  const g = G; g.t += dt; g.scroll += g.speed*dt;
  const dmg = 1 + save.lv.dmg, multi = 1 + save.lv.multi;

  // 생성
  if(g.rowsLeft > 0){ g.spawnT -= dt; if(g.spawnT<=0){ spawnRow(); g.rowsLeft--; g.spawnT = rnd(1.5,2.1) * 55/g.speed*1.3; } }
  else if(!g.bossSpawned && g.objs.length < 4){ g.bossSpawned = true; spawnBoss(); }

  // 사격
  g.hero.fireT -= dt; g.hero.bob += dt*10;
  if(g.hero.fireT <= 0){
    g.hero.fireT = fireInterval(save.lv.rate);
    for(let i=0;i<multi;i++){ const off=(i-(multi-1)/2)*9; g.arrows.push({x:g.hero.x+off, y:HERO_Y-22, vx:off*1.6, vy:-560}); }
    sfx.shoot();
  }

  // 화살
  for(const a of g.arrows){
    a.x += a.vx*dt; a.y += a.vy*dt;
    for(const o of g.objs){
      if(o.done || a.dead) continue;
      if(a.x>o.x && a.x<o.x+o.w && a.y>o.y && a.y<o.y+o.h){
        a.dead = true;
        if(o.type==='gate') hitGate(o);
        else { o.n -= dmg; o.flash = 0.06; g.kills += 0; burst(a.x,a.y,'#ff8080',3,70);
          if(o.n <= 0){ o.done = true; g.kills += Math.ceil(o.n0*0.5); burst(o.x+o.w/2,o.y+o.h/2,'#ff5050',24,200); addText(o.x+o.w/2,o.y,'격파!','#ffd54a',20); if(o.type==='boss'){ g.bossDone=true; sfx.win(); buzz(120);} }
        }
      }
    }
    if(a.y < -40 || a.x<0 || a.x>VW) a.dead = true;
  }
  g.arrows = g.arrows.filter(a=>!a.dead);

  // 오브젝트 이동 / 충돌
  for(const o of g.objs){
    const sp = o.type==='boss' ? g.speed*0.55 : g.speed;
    o.y += sp*dt; if(o.flash>0) o.flash -= dt;
    if(o.done) continue;
    const bottom = o.y + o.h;
    if(o.type==='gate'){
      if(bottom > HERO_Y-14 && o.y < HERO_Y+6 && heroOverlap(o)) applyGate(o);
    } else {
      if(bottom > HERO_Y-14 && o.y < HERO_Y+10 && heroOverlap(o) && g.troops>0) fight(o);
      if(o.n <= 0 && !o.done){ o.done = true; }
      if(o.done && o.type==='boss'){ g.bossDone = true; sfx.win(); buzz(120); addText(VW/2, HERO_Y-80,'보스 격파!','#ffd54a',30,1.4); }
      if(!o.done && bottom >= WALL_Y){
        const d = Math.ceil(o.n); g.wall -= d; o.done = true; g.shake = 0.3;
        addText(o.x+o.w/2, WALL_Y-10, '성벽 -'+d, '#ff5a5a', 22); burst(o.x+o.w/2, WALL_Y, '#c9a27a', 20, 160);
        sfx.wall(); buzz(60);
        if(o.type==='boss') g.bossDone = true;
      }
    }
  }
  g.objs = g.objs.filter(o=>!(o.done && (o.type!=='gate' || o.y>VH+40)) && o.y < VH+60);
  // 지나간 게이트(통과 못한 것)도 화면 밖에서 정리
  g.objs = g.objs.filter(o=>!(o.type==='gate' && o.y>VH));

  // 효과
  for(const p of g.fx){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; }
  g.fx = g.fx.filter(p=>p.t<p.life);
  for(const t of g.texts){ t.t+=dt; t.y-=30*dt; }
  g.texts = g.texts.filter(t=>t.t<t.life);
  if(g.shake>0) g.shake-=dt;

  updateHud();

  // 승패
  if(g.wall <= 0){ g.wall = 0; endStage(false); }
  else if(g.bossSpawned && g.bossDone && !g.objs.some(o=>o.type!=='gate' && !o.done)){ endStage(true); }
}

// ───────── 그리기 ─────────
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawBG(scroll){
  // 바다
  const sea = ctx.createLinearGradient(0,0,0,VH); sea.addColorStop(0,'#1c6fb8'); sea.addColorStop(1,'#0e4f8f');
  ctx.fillStyle = sea; ctx.fillRect(0,0,VW,VH);
  ctx.strokeStyle='rgba(255,255,255,.13)'; ctx.lineWidth=2;
  const wy = scroll*0.4 % 60;
  for(let y=-60+wy; y<VH; y+=60){ for(let x=-20; x<VW; x+=70){ const ox = ((y/60|0)%2)*35; ctx.beginPath(); ctx.moveTo(x+ox,y); ctx.quadraticCurveTo(x+ox+10,y-5,x+ox+20,y); ctx.stroke(); } }
  // 다리 바닥
  ctx.fillStyle = '#d9c7a3'; ctx.fillRect(ROAD_L, 0, ROAD_W, VH);
  ctx.strokeStyle = 'rgba(120,95,60,.25)'; ctx.lineWidth = 1;
  const ty = scroll % 26;
  for(let y=-26+ty, row=0; y<VH; y+=26, row++){
    ctx.beginPath(); ctx.moveTo(ROAD_L,y); ctx.lineTo(ROAD_L+ROAD_W,y); ctx.stroke();
    const off = (Math.floor((scroll+ (y-ty))/26)%2)*20;
    for(let x=ROAD_L+off; x<ROAD_L+ROAD_W; x+=40){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+26); ctx.stroke(); }
  }
  // 차선 구분
  ctx.strokeStyle='rgba(90,70,40,.35)'; ctx.setLineDash([14,14]); ctx.lineDashOffset = -scroll; ctx.lineWidth=2;
  for(let i=1;i<3;i++){ const x=ROAD_L+i*LANE_W; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,VH); ctx.stroke(); }
  ctx.setLineDash([]);
  // 난간(성가퀴)
  for(const side of [0,1]){
    const x = side? ROAD_L+ROAD_W : ROAD_L-14;
    ctx.fillStyle='#b8a27a'; ctx.fillRect(x,0,14,VH);
    ctx.fillStyle='#9c875f';
    const my = scroll % 34;
    for(let y=-34+my; y<VH; y+=34) ctx.fillRect(x+(side?0:0), y, 14, 16);
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(side? x : x+10, 0, 4, VH);
  }
}

function drawSoldier(x,y,body,helm,s=1){
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x,y+4*s,4*s,2*s,0,0,6.283); ctx.fill();
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,4*s,0,6.283); ctx.fill();
  ctx.fillStyle=helm; ctx.beginPath(); ctx.arc(x,y-3.2*s,2.7*s,0,6.283); ctx.fill();
}

function drawGate(o){
  const c = o.op==='-' ? ['#ff6b6b','#c62828','#7f1414'] : o.op==='x' ? ['#ffe27a','#f5a623','#8a5a00'] : ['#6ec1ff','#1e7ce0','#0d3f7a'];
  ctx.save();
  if(o.done){ ctx.globalAlpha = 0.25; }
  ctx.fillStyle = c[2]; rr(o.x, o.y+4, o.w, o.h, 8); ctx.fill();
  const gr = ctx.createLinearGradient(0,o.y,0,o.y+o.h); gr.addColorStop(0,c[0]); gr.addColorStop(1,c[1]);
  ctx.fillStyle = o.flash>0 ? '#fff' : gr; rr(o.x, o.y, o.w, o.h, 8); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; rr(o.x+2,o.y+2,o.w-4,o.h-4,6); ctx.stroke();
  const label = o.op==='x' ? '×'+o.v : (o.v>0?'+':'')+o.v;
  ctx.font='900 22px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=5; ctx.strokeStyle=c[2]; ctx.strokeText(label, o.x+o.w/2, o.y+o.h/2+1);
  ctx.fillStyle='#fff'; ctx.fillText(label, o.x+o.w/2, o.y+o.h/2+1);
  ctx.restore();
}

function drawEnemy(o){
  if(o.done) return;
  const n = Math.ceil(o.n), shown = Math.min(n, 24);
  const cols = 6, rows = Math.ceil(shown/cols);
  ctx.save();
  if(o.flash>0) ctx.globalAlpha = 0.7;
  for(let i=0;i<shown;i++){
    const cx = o.x + 10 + (i%cols)*((o.w-20)/(cols-1)), cy = o.y + 10 + Math.floor(i/cols)*((o.h-14)/Math.max(1,rows-1||1)) + Math.sin(G.t*12+i)*1.2;
    drawSoldier(cx, cy, '#e53935', '#8d6e63', 1.05);
  }
  ctx.restore();
  ctx.font='900 18px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle='#5a0000'; ctx.strokeText(n, o.x+o.w/2, o.y-8); ctx.fillStyle='#ffdddd'; ctx.fillText(n, o.x+o.w/2, o.y-8);
}

function drawBoss(o){
  if(o.done) return;
  const cx = o.x+o.w/2, cy = o.y+o.h/2, b = Math.sin(G.t*6)*3;
  // 부하들
  for(let i=0;i<18;i++){ const x=o.x+12+(i%9)*((o.w-24)/8), y=o.y+(i<9?6:o.h-6); drawSoldier(x,y+Math.sin(G.t*10+i),'#e53935','#8d6e63'); }
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx,cy+30,34,10,0,0,6.283); ctx.fill();
  ctx.fillStyle = o.flash>0 ? '#fff' : '#b71c1c'; ctx.beginPath(); ctx.arc(cx,cy+b,30,0,6.283); ctx.fill();
  ctx.fillStyle='#78909c'; ctx.beginPath(); ctx.arc(cx,cy-20+b,18,Math.PI,0); ctx.fill(); ctx.fillRect(cx-18,cy-20+b,36,10);
  ctx.fillStyle='#ffd54a'; ctx.beginPath(); ctx.moveTo(cx-14,cy-36+b); ctx.lineTo(cx-8,cy-48+b); ctx.lineTo(cx,cy-38+b); ctx.lineTo(cx+8,cy-48+b); ctx.lineTo(cx+14,cy-36+b); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#212121'; ctx.fillRect(cx-10,cy-14+b,20,4);
  // 체력바
  const w=o.w-20, p=Math.max(0,o.n/o.n0);
  ctx.fillStyle='rgba(0,0,0,.5)'; rr(o.x+10,o.y-22,w,12,6); ctx.fill();
  ctx.fillStyle='#ff4d4d'; rr(o.x+10,o.y-22,w*p,12,6); ctx.fill();
  ctx.font='900 13px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
  ctx.fillText('보스 '+Math.ceil(o.n), cx, o.y-16);
}

function drawHero(){
  const g=G, hx=g.hero.x, hy=HERO_Y, shown=Math.min(g.troops, FORM.length);
  for(let i=shown-1;i>=0;i--){ const f=FORM[i]; drawSoldier(hx+f[0], hy+8+f[1]+Math.sin(g.hero.bob+i)*0.8, '#1e88e5', '#cfd8dc'); }
  // 영웅
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(hx,hy+10,13,5,0,0,6.283); ctx.fill();
  ctx.fillStyle='#e53935'; ctx.beginPath(); ctx.moveTo(hx-10,hy-6); ctx.lineTo(hx+10,hy-6); ctx.lineTo(hx+14,hy+12); ctx.lineTo(hx-14,hy+12); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1565c0'; ctx.beginPath(); ctx.arc(hx,hy,10,0,6.283); ctx.fill();
  ctx.fillStyle='#eceff1'; ctx.beginPath(); ctx.arc(hx,hy-10,8,0,6.283); ctx.fill();
  ctx.fillStyle='#37474f'; ctx.fillRect(hx-5,hy-11,10,2.5);
  ctx.strokeStyle='#8d6e63'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(hx+11,hy-6,9,-2.2,0.6); ctx.stroke();
  // 병력 숫자
  ctx.font='900 20px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(13,63,122,.9)'; rr(hx-26, hy-50, 52, 24, 12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(g.troops, hx, hy-38);
}

function drawWall(){
  const y = WALL_Y;
  ctx.fillStyle='#8d7b5a'; ctx.fillRect(0,y+8,VW,VH-y);
  ctx.fillStyle='#a8946c'; ctx.fillRect(0,y,VW,14);
  for(let x=0;x<VW;x+=22){ ctx.fillStyle='#a8946c'; ctx.fillRect(x,y-10,13,12); ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(x+10,y-10,3,12); }
  ctx.fillStyle='rgba(0,0,0,.15)'; for(let x=0;x<VW;x+=30) for(let yy=y+18; yy<VH; yy+=16) ctx.fillRect(x+((yy/16|0)%2)*15, yy, 28, 1.5);
  // 깃발
  for(const fx of [ROAD_L-6, ROAD_L+ROAD_W+6]){ ctx.fillStyle='#5d4037'; ctx.fillRect(fx-1.5,y-40,3,32); ctx.fillStyle='#1e88e5'; ctx.beginPath(); ctx.moveTo(fx+1.5,y-40); ctx.lineTo(fx+18+Math.sin(G.t*5)*2,y-34); ctx.lineTo(fx+1.5,y-28); ctx.fill(); }
}

function render(){
  ctx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  ctx.save();
  if(G && G.shake>0){ ctx.translate(rnd(-4,4)*G.shake*3, rnd(-4,4)*G.shake*3); }
  drawBG(G ? G.scroll : performance.now()*0.03);
  if(G){
    for(const o of G.objs){ if(o.type==='gate') drawGate(o); }
    for(const o of G.objs){ if(o.type==='enemy') drawEnemy(o); else if(o.type==='boss') drawBoss(o); }
    ctx.strokeStyle='#fff3b0'; ctx.lineWidth=2;
    for(const a of G.arrows){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x-a.vx*0.02,a.y+12); ctx.stroke(); }
    drawWall();
    drawHero();
    for(const p of G.fx){ ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); }
    ctx.globalAlpha=1;
    for(const t of G.texts){ ctx.globalAlpha=Math.min(1,(t.life-t.t)*3); ctx.font=`900 ${t.size}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.strokeText(t.s,t.x,t.y); ctx.fillStyle=t.c; ctx.fillText(t.s,t.x,t.y); }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// ───────── 루프 ─────────
function loop(ts){
  const dt = Math.min(0.05, (ts-last)/1000 || 0); last = ts;
  if(state==='play' && G) update(dt);
  render();
  requestAnimationFrame(loop);
}

// ───────── 입력 ─────────
let drag = null;
cv.addEventListener('pointerdown', e=>{ if(state!=='play') return; audioInit(); drag = {px:e.clientX, hx:G.hero.x}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{ if(!drag || state!=='play') return; G.hero.x = clamp(drag.hx + (e.clientX-drag.px)/SC*1.15, ROAD_L+14, ROAD_L+ROAD_W-14); });
const endDrag = ()=>{ drag=null; }; cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e=>{ if(state!=='play') return; if(e.key==='ArrowLeft') G.hero.x=clamp(G.hero.x-LANE_W,ROAD_L+14,ROAD_L+ROAD_W-14); if(e.key==='ArrowRight') G.hero.x=clamp(G.hero.x+LANE_W,ROAD_L+14,ROAD_L+ROAD_W-14); });

// ───────── UI ─────────
const $ = id=>document.getElementById(id);
function show(id){ ['oTitle','oPause','oResult','oShop'].forEach(o=>$(o).classList.toggle('show', o===id)); $('hud').style.display = (state==='play'||state==='pause')?'flex':'none'; }
function updateHud(){ if(!G) return; $('hStage').textContent=G.stage; $('hGold').textContent=save.gold; const p=Math.max(0,G.wall/G.wallMax*100); $('hHp').style.width=p+'%'; $('hHp').style.background = p>50?'linear-gradient(#7be36f,#3aa832)':p>25?'linear-gradient(#ffd54a,#e6a400)':'linear-gradient(#ff7a7a,#d32f2f)'; }
function titleText(){ $('bStart').textContent = save.stage>1 ? `스테이지 ${save.stage} 시작` : '게임 시작'; }

function startStage(){ audioInit(); newGame(); state='play'; show(null); }
function endStage(win){
  state='result';
  const g=G, reward = Math.round((win? 20 + g.stage*12 : 5 + g.stage*3) + g.kills*0.4 + (win? g.troops*0.3:0));
  save.gold += reward; g.goldEarned = reward;
  if(win){ save.stage++; save.best=Math.max(save.best, save.stage); sfx.win(); } else sfx.lose();
  persist();
  $('rTitle').textContent = win ? '🏆 승리!' : '💥 성벽 함락';
  $('rText').innerHTML = (win ? `스테이지 ${g.stage} 방어 성공!<br>남은 병력 ${g.troops} · 성벽 ${Math.ceil(g.wall)}/${g.wallMax}` : `스테이지 ${g.stage} 실패…<br>상점에서 강화하고 다시 도전하세요`) + `<br><span class="gold">🪙 +${reward}</span>`;
  $('bNext').textContent = win ? `스테이지 ${save.stage} 시작` : '다시 도전';
  show('oResult'); buzz(win?[60]:[120]);
}
let shopBack = 'oTitle';
function openShop(back){ shopBack = back; renderShop(); show('oShop'); }
function renderShop(){
  $('sGold').textContent = save.gold;
  $('shopList').innerHTML = UPG.map(u=>{ const l=save.lv[u.id], max=l>=u.max, c=cost(u);
    return `<div class="item"><div class="ic">${u.ic}</div><div class="tx"><b>${u.name}</b> Lv.${l}<br>${u.desc(l)}${max?'':' → '+u.desc(l+1).replace(/^[^0-9]*/,'')}</div><button data-u="${u.id}" ${max||save.gold<c?'disabled':''}>${max?'MAX':'🪙 '+c}</button></div>`; }).join('');
}
$('shopList').addEventListener('click', e=>{ const id=e.target.dataset&&e.target.dataset.u; if(!id) return; const u=UPG.find(x=>x.id===id), c=cost(u); if(save.gold<c||save.lv[id]>=u.max) return; save.gold-=c; save.lv[id]++; persist(); audioInit(); sfx.gain(); renderShop(); });

$('bStart').onclick = startStage;
$('bShop1').onclick = ()=>openShop('oTitle');
$('bShop2').onclick = ()=>openShop('oResult');
$('bShopClose').onclick = ()=>{ titleText(); show(shopBack); };
$('bNext').onclick = startStage;
$('bTitle').onclick = ()=>{ state='title'; G=null; titleText(); show('oTitle'); };
$('bReset').onclick = ()=>{ if($('bReset').dataset.arm){ save={stage:1,gold:0,lv:{dmg:0,rate:0,multi:0,troop:0,wall:0},best:1}; persist(); titleText(); $('bReset').textContent='처음부터 다시'; delete $('bReset').dataset.arm; } else { $('bReset').dataset.arm=1; $('bReset').textContent='한 번 더 누르면 초기화'; setTimeout(()=>{ $('bReset').textContent='처음부터 다시'; delete $('bReset').dataset.arm; },2500);} };
$('pauseBtn').onclick = ()=>pause();
$('bResume').onclick = ()=>{ state='play'; show(null); };
$('bQuit').onclick = ()=>{ state='title'; G=null; titleText(); show('oTitle'); };
function pause(){ if(state==='play'){ state='pause'; show('oPause'); } }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pause(); });

// 안드로이드 뒤로가기: true면 앱이 처리 안 함
window.onBack = function(){
  if(state==='play'){ pause(); return true; }
  if(state==='pause'){ state='play'; show(null); return true; }
  if($('oShop').classList.contains('show')){ $('bShopClose').onclick(); return true; }
  if(state==='result'){ $('bTitle').onclick(); return true; }
  return false;
};
// 테스트용
window.__game = ()=>({state, G, save});

resize(); titleText(); show('oTitle'); requestAnimationFrame(loop);
</script>
</body>
