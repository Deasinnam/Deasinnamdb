<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>주문하기</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.tno{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:18px;white-space:nowrap}
.shop{font-size:21px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop small{display:block;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .btn{min-height:50px;padding:0 18px;font-size:16px}
.main{flex:1;display:flex;min-height:0}
nav{flex:0 0 150px;overflow:auto;padding:14px 10px;background:#fff;border-right:1px solid var(--line)}
nav button{display:block;width:100%;text-align:left;padding:16px 14px;border-radius:14px;font-size:18px;font-weight:700;color:var(--sub);margin-bottom:4px}
nav button.on{background:var(--accent-soft);color:var(--accent)}
.list{flex:1;overflow:auto;padding:18px 18px 120px;-webkit-overflow-scrolling:touch}
.cat-h{font-size:22px;font-weight:800;margin:6px 4px 12px}
.grid{display:flex;flex-wrap:wrap;margin:0 -7px 18px}
.item{width:calc(33.333% - 14px);margin:0 7px 14px;text-align:left;overflow:hidden;position:relative;display:flex;flex-direction:column}
.item .ph{position:relative;width:100%;padding-top:72%;background:var(--soft) center/cover no-repeat}
.item .ph i{position:absolute;inset:0;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:46px;font-weight:900}
.item .tx{padding:12px 14px 14px}
.item .nm{font-size:18px;font-weight:800;line-height:1.3}
.item .ds{font-size:13px;color:var(--sub);margin-top:3px;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pr{font-size:18px;font-weight:800;margin-top:6px}
.item .best{position:absolute;top:10px;left:10px;background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px}
.item .qty{position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;min-width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;padding:0 8px}
.item.sold{pointer-events:none}
.item.sold .ph:after{content:"품절";position:absolute;inset:0;left:0;top:0;right:0;bottom:0;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--bad)}
.item.sold .nm,.item.sold .pr{color:#aaa}
.item:active{transform:scale(.98)}
aside{flex:0 0 340px;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line)}
aside h3{margin:0;padding:18px 20px 8px;font-size:20px}
.cart{flex:1;overflow:auto;padding:0 14px}
.line{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--soft)}
.line .n{flex:1;min-width:0}
.line .n b{display:block;font-size:16px}
.line .n span{font-size:14px;color:var(--sub)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:22px;font-weight:800}
.step em{font-style:normal;width:30px;text-align:center;font-weight:900;font-size:17px}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:16px;line-height:1.6}
.sum{padding:16px 20px 20px;border-top:1px solid var(--line)}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:16px;color:var(--sub)}
.sum .tot b{font-size:26px;color:var(--ink)}
.sum .btn{width:100%}
.bar{display:none}
.notice{background:var(--warn-soft);color:#8a4b00;padding:10px 20px;font-size:15px;font-weight:700}
.olist .o{padding:14px 0;border-bottom:1px solid var(--soft)}
.olist .o .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:800}
.st{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px}
.st.new{background:var(--blue-soft);color:var(--blue)}
.st.cooking{background:var(--warn-soft);color:var(--warn)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.calls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.calls button{flex:1 1 40%;min-height:70px;border-radius:16px;background:var(--soft);font-size:18px;font-weight:800}
.calls button:active{background:var(--accent-soft)}
.done-ic{width:84px;height:84px;border-radius:50%;background:var(--ok);margin:4px auto 16px;display:flex;align-items:center;justify-content:center}
.off{position:fixed;left:0;right:0;top:0;padding:8px;text-align:center;background:var(--bad);color:#fff;font-weight:800;z-index:60}
/* 폰 · 세로 태블릿: 장바구니는 아래 줄 + 펼침 */
@media (max-width:899px){
  aside{position:fixed;left:0;right:0;bottom:0;top:18%;z-index:40;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .2s}
  aside.open{transform:none}
  .bar{display:flex;position:fixed;left:14px;right:14px;bottom:14px;z-index:30;align-items:center;gap:12px;padding:10px 10px 10px 20px;border-radius:20px;background:var(--ink);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .bar .c{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .btn{min-height:54px}
  .item{width:calc(50% - 14px)}
  nav{flex-basis:110px}
  nav button{font-size:16px;padding:14px 10px}
}
@media (max-width:560px){ .item .ph{padding-top:56%} nav{display:none} .shop small{display:none} header .btn span{display:none} header{padding:10px 12px;gap:8px} header .btn{min-height:46px;padding:0 13px} .tno{font-size:15px;padding:7px 10px} .shop{font-size:17px} .bar .c{font-size:15px} }
@media (min-width:1300px){ .item{width:calc(25% - 14px)} aside{flex-basis:380px} }
</style></head>
<body>
<div class="app">
  <header>
    <div class="tno" id="tno">테이블</div>
    <div class="shop" id="shop">불러오는 중…<small></small></div>
    <button class="btn" id="bOrders">🧾 <span>주문 내역</span></button>
    <button class="btn pri" id="bCall">🔔 <span>직원 호출</span></button>
  </header>
  <div class="notice hide" id="notice"></div>
  <div class="main">
    <nav id="cats"></nav>
    <div class="list" id="list"></div>
    <aside id="aside">
      <h3>담은 메뉴</h3>
      <div class="cart" id="cart"></div>
      <div class="sum">
        <div class="tot"><span id="cnt">0개</span><b><span id="sum">0</span>원</b></div>
        <button class="btn pri big" id="bOrder" disabled>주문하기</button>
      </div>
    </aside>
  </div>
  <div class="bar" id="bar"><div class="c" id="barTx">메뉴를 눌러 담아 주세요</div><button class="btn pri" id="barBtn">담은 메뉴 보기</button></div>
</div>
<div class="off hide" id="off">카운터와 연결이 잠시 끊겼어요 · 다시 잇는 중</div>
<div id="modal"></div>
<script>
window.onerror=function(m,u,l){console.error("JS "+m+" @"+l)};
var $=function(id){return document.getElementById(id)};
var T=window.TO||null;
var q=location.search.match(/[?&]t=(\d+)/);
var TABLE=q?+q[1]:(T&&T.table?T.table():1);
var S={items:[],categories:[],orders:[]},REV=0,cart={},curCat="",lastTouch=Date.now(),fails=0;
var COLORS=["#E8590C","#1C7ED6","#2F9E44","#AE3EC9","#F08C00","#0C8599","#D6336C","#5C7CFA"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function won(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.parentNode&&d.parentNode.removeChild(d)},2600)}
function xhr(m,u,body,cb,timeout){var x=new XMLHttpRequest();x.open(m,u,true);x.timeout=timeout||8000;
  x.onload=function(){var j=null;try{j=JSON.parse(x.responseText)}catch(e){}cb(x.status,j)};
  x.onerror=x.ontimeout=function(){cb(0,null)};
  if(body){x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(body))}else x.send()}
function item(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null}
function color(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length]}

function poll(){
  xhr("GET","/api/state?table="+TABLE+"&rev="+REV,null,function(st,j){
    if(st===200&&j){ fails=0; $("off").classList.add("hide"); var first=!REV; REV=j.rev; S=j; render(first); setTimeout(poll,REV?50:1000); }
    else { fails++; if(fails>1)$("off").classList.remove("hide"); if(fails>6&&T&&T.lost){ T.lost(); return } setTimeout(poll,2500); }
  },30000);
}

function render(first){
  $("tno").textContent=TABLE+"번 테이블";
  $("shop").innerHTML=esc(S.shop||"")+"<small>메뉴를 누르면 담기고, 주문하기를 누르면 바로 주방으로 갑니다</small>";
  $("notice").textContent=S.notice||""; $("notice").classList.toggle("hide",!S.notice);
  // 분류
  var cats=[{id:"_best",name:"추천"}].concat(S.categories||[]);
  var hasBest=S.items.some(function(i){return i.best});
  if(!hasBest)cats.shift();
  if(!curCat||!cats.some(function(c){return c.id===curCat}))curCat=cats.length?cats[0].id:"";
  var h="";cats.forEach(function(c){h+='<button data-c="'+esc(c.id)+'"'+(c.id===curCat?' class="on"':'')+'>'+esc(c.name)+'</button>'});
  $("cats").innerHTML=h;
  [].forEach.call($("cats").querySelectorAll("button"),function(b){b.onclick=function(){curCat=b.getAttribute("data-c");render();var el=$("c-"+curCat);if(el)$("list").scrollTop=el.offsetTop-$("list").offsetTop-10}});
  // 메뉴(분류별로 이어서)
  h="";
  cats.forEach(function(c){
    var its=S.items.filter(function(i){return c.id==="_best"?i.best:i.cat===c.id});
    if(!its.length)return;
    h+='<div class="cat-h" id="c-'+esc(c.id)+'">'+esc(c.name)+'</div><div class="grid">';
    its.forEach(function(i){
      var q=cart[i.id]||0;
      h+='<button class="item card'+(i.soldout?" sold":"")+'" data-id="'+esc(i.id)+'">'+
        '<div class="ph" style="'+(i.img?'background-image:url('+esc(i.img)+')':'background:'+color(i.name)+'1f')+'">'+(i.img?'':'<i style="color:'+color(i.name)+'">'+esc(i.name.charAt(0))+'</i>')+'</div>'+
        (i.best&&c.id!=="_best"?'<span class="best">추천</span>':'')+(q?'<span class="qty">'+q+'</span>':'')+
        '<div class="tx"><div class="nm">'+esc(i.name)+'</div><div class="ds">'+esc(i.desc||"")+'</div><div class="pr">'+won(i.price)+'원</div></div></button>';
    });
    h+='</div>';
  });
  if(!h)h='<div class="empty">아직 메뉴가 없습니다.<br>카운터의 메뉴 관리에서 메뉴를 넣어 주세요.</div>';
  $("list").innerHTML=h;
  [].forEach.call($("list").querySelectorAll(".item"),function(b){b.onclick=function(){add(b.getAttribute("data-id"),1)}});
  // 품절 · 없어진 메뉴는 장바구니에서 빼기
  for(var k in cart){var it=item(k);if(!it||it.soldout){delete cart[k];if(!first)toast((it?it.name+"이(가) 방금 품절되어":"메뉴가 바뀌어")+" 장바구니에서 뺐어요")}}
  drawCart();
  if($("modal").getAttribute("data-k")==="orders")showOrders();
}

function add(id,d){
  lastTouch=Date.now();
  var it=item(id);if(!it||it.soldout)return;
  var q=(cart[id]||0)+d; if(q<=0)delete cart[id]; else cart[id]=Math.min(q,99);
  [].forEach.call(document.querySelectorAll('.item[data-id="'+id+'"]'),function(el){
    var b=el.querySelector(".qty");if(cart[id]){if(!b){b=document.createElement("span");b.className="qty";el.appendChild(b)}b.textContent=cart[id]}else if(b)b.parentNode.removeChild(b)});
  if(d>0&&T&&T.vibrate)T.vibrate(15);
  drawCart();
}
function totals(){var n=0,s=0;for(var k in cart){var it=item(k);if(it){n+=cart[k];s+=cart[k]*it.price}}return{n:n,s:s}}
function drawCart(){
  var h="";
  for(var k in cart){var it=item(k);if(!it)continue;
    h+='<div class="line"><div class="n"><b>'+esc(it.name)+'</b><span>'+won(it.price*cart[k])+'원</span></div>'+
      '<div class="step"><button data-k="'+esc(k)+'" data-d="-1">−</button><em>'+cart[k]+'</em><button data-k="'+esc(k)+'" data-d="1">+</button></div></div>';}
  $("cart").innerHTML=h||'<div class="empty">메뉴를 누르면<br>여기에 담깁니다</div>';
  [].forEach.call($("cart").querySelectorAll("button"),function(b){b.onclick=function(){add(b.getAttribute("data-k"),+b.getAttribute("data-d"))}});
  var t=totals();
  $("cnt").textContent=t.n+"개";$("sum").textContent=won(t.s);$("bOrder").disabled=!t.n;
  $("barTx").textContent=t.n?(t.n+"개 · "+won(t.s)+"원"):"메뉴를 눌러 담아 주세요";
  $("barBtn").textContent=t.n?"주문하기":"주문 내역";
}

// ----- 창 -----
function modal(k,html){var m=$("modal");m.setAttribute("data-k",k||"");m.innerHTML=html?'<div class="modal"><div class="box">'+html+'</div></div>':"";
  if(html){var bg=m.firstChild;bg.onclick=function(e){if(e.target===bg)modal()}}}
function closeAside(){$("aside").classList.remove("open")}

$("bOrder").onclick=function(){
  var t=totals();if(!t.n)return;
  var h='<h2>이대로 주문할까요?</h2><p class="muted">'+TABLE+'번 테이블 · '+t.n+'개</p><div style="margin:14px 0">';
  for(var k in cart){var it=item(k);if(it)h+='<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:17px"><span>'+esc(it.name)+' × '+cart[k]+'</span><b>'+won(it.price*cart[k])+'원</b></div>'}
  h+='</div><div class="field"><label>요청 사항 (선택)</label><input id="note" maxlength="100" placeholder="예: 얼음 적게, 덜 맵게"></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:20px;margin:6px 0 18px"><span>합계</span><b>'+won(t.s)+'원</b></div>'+
    '<div style="display:flex;gap:10px"><button class="btn ghost big" id="mNo" style="flex:1">더 고를게요</button><button class="btn pri big" id="mYes" style="flex:2">주문하기</button></div>';
  modal("confirm",h);
  $("mNo").onclick=function(){modal()};
  $("mYes").onclick=function(){
    var b=this;b.disabled=true;b.textContent="보내는 중…";
    var items=[];for(var k in cart)items.push({id:k,qty:cart[k]});
    xhr("POST","/api/order",{table:TABLE,items:items,note:$("note").value},function(st,j){
      if(st===200&&j&&j.ok){
        cart={};drawCart();closeAside();render();
        modal("ok",'<div style="text-align:center"><div class="done-ic"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>'+
          '<h2>주문이 들어갔어요</h2><p class="muted" style="font-size:18px">주문 번호 <b style="color:var(--ink)">#'+j.order.no+'</b> · 준비되면 화면에 알려 드릴게요</p>'+
          '<button class="btn pri big" style="width:100%;margin-top:14px" id="mOk">확인</button></div>');
        $("mOk").onclick=function(){modal()};
        setTimeout(function(){if($("modal").getAttribute("data-k")==="ok")modal()},5000);
      } else { b.disabled=false;b.textContent="다시 주문하기"; toast(j&&j.error?j.error:"카운터에 닿지 않았어요. 잠시 뒤 다시 눌러 주세요"); }
    });
  };
};

$("bCall").onclick=function(){
  var opts=["직원 호출","물","물티슈","수저 · 젓가락","앞접시","계산할게요"];
  var h='<h2>무엇이 필요하세요?</h2><p class="muted">누르면 카운터에 바로 알려집니다</p><div class="calls">';
  opts.forEach(function(o){h+='<button data-w="'+esc(o)+'">'+esc(o)+'</button>'});
  h+='</div><button class="btn ghost" style="width:100%" id="mX">닫기</button>';
  modal("call",h);$("mX").onclick=function(){modal()};
  [].forEach.call($("modal").querySelectorAll(".calls button"),function(b){b.onclick=function(){
    xhr("POST","/api/call",{table:TABLE,what:b.getAttribute("data-w")},function(st){modal();toast(st===200?"카운터에 알렸어요. 곧 갈게요!":"카운터에 닿지 않았어요")})}});
};

var ST={"new":"접수","cooking":"만드는 중","done":"나왔어요"};
function showOrders(){
  var os=(S.orders||[]).slice().reverse(),sum=0;
  var h='<h2>우리 테이블 주문 내역</h2><div class="olist">';
  os.forEach(function(o){sum+=o.total;
    h+='<div class="o"><div class="h"><span>#'+o.no+' · '+new Date(o.time).toTimeString().slice(0,5)+'</span><span class="st '+o.status+'">'+(ST[o.status]||"")+'</span></div>';
    o.items.forEach(function(l){h+='<div style="display:flex;justify-content:space-between;color:var(--sub);padding:2px 0"><span>'+esc(l.name)+' × '+l.qty+'</span><span>'+won(l.price*l.qty)+'원</span></div>'});
    h+='</div>'});
  if(!os.length)h+='<div class="empty">아직 주문이 없습니다</div>';
  h+='</div><div style="display:flex;justify-content:space-between;font-size:20px;margin:16px 0"><span>지금까지</span><b>'+won(sum)+'원</b></div><button class="btn pri big" style="width:100%" id="mX">닫기</button>';
  modal("orders",h);$("mX").onclick=function(){modal()};
}
$("bOrders").onclick=showOrders;
$("barBtn").onclick=function(){ if(totals().n)$("aside").classList.add("open"); else showOrders(); };
$("aside").querySelector("h3").onclick=closeAside;

// 나가기(사장님): 테이블 번호를 3초 누르기 → 비밀번호
var hold=null;
function holdStart(){hold=setTimeout(function(){
  modal("pin",'<h2>설정으로 나가기</h2><p class="muted">설정할 때 정한 비밀번호를 넣어 주세요</p><div class="field"><input id="pinIn" type="password" inputmode="numeric" maxlength="8"></div><div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" id="mNo">취소</button><button class="btn pri" style="flex:1" id="mYes">나가기</button></div>');
  $("pinIn").focus();$("mNo").onclick=function(){modal()};
  $("mYes").onclick=function(){if(!(T&&T.leave($("pinIn").value)))toast("비밀번호가 맞지 않습니다")};
},3000)}
function holdEnd(){clearTimeout(hold)}
$("tno").addEventListener("touchstart",holdStart);$("tno").addEventListener("touchend",holdEnd);
$("tno").addEventListener("mousedown",holdStart);$("tno").addEventListener("mouseup",holdEnd);
window.onBack=function(){ if($("modal").innerHTML)modal(); else closeAside(); };

// 손님이 떠나고 3분 동안 아무도 안 만지면 장바구니 비우기
setInterval(function(){ if(Date.now()-lastTouch>180000&&totals().n){cart={};drawCart();render()} },15000);
document.addEventListener("touchstart",function(){lastTouch=Date.now()},true);

poll();
</script>
</body></html>
