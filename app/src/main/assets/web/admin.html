<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>카운터 · 덜누름 테이블오더</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{overflow:hidden}
.app{display:flex;height:100%}
/* 왼쪽 줄(넓은 화면 · 덱스) */
.rail{flex:0 0 96px;background:#1D1B18;color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:52px;height:52px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;margin-bottom:14px}
.tab{width:80px;padding:12px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#B9B3A8;position:relative}
.tab svg{width:26px;height:26px}
.tab.on{background:#36322C;color:#fff}
.tab .dot{position:absolute;top:6px;right:14px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.body{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.top .shop{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .ip{font-size:14px;color:var(--sub);white-space:nowrap}
.top .ip b{color:var(--ink)}
.top .sp{flex:1}
.kpi{display:flex;gap:20px;align-items:center}
.kpi div{text-align:right}
.kpi small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.kpi b{font-size:20px}
.clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.view{flex:1;overflow:auto;padding:18px 22px 22px;min-height:0;-webkit-overflow-scrolling:touch}
/* 호출 */
.callbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.call{display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;border-radius:16px;padding:10px 10px 10px 18px;font-weight:800;font-size:17px;animation:pulse 1.6s infinite}
.call button{background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(232,89,12,.25)}}
/* 주문판 */
.seg{display:none;gap:8px;margin-bottom:14px}
.seg button{flex:1;min-height:52px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:16px}
.seg button.on{background:var(--ink);color:#fff}
.board{display:flex;gap:16px;align-items:flex-start;min-height:100%}
.col{flex:1;min-width:0;background:var(--soft);border-radius:20px;padding:12px}
.col h3{margin:2px 6px 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.col h3 .n{background:#fff;border-radius:999px;padding:2px 10px;font-size:15px}
.col.c-new h3{color:var(--blue)} .col.c-cooking h3{color:var(--warn)} .col.c-done h3{color:var(--ok)}
.od{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-left:6px solid var(--blue)}
.od.cooking{border-left-color:var(--warn)} .od.done{border-left-color:var(--ok);opacity:.85}
.od.fresh{animation:fresh 1s 3}
@keyframes fresh{50%{background:var(--blue-soft)}}
.od .h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.od .t{font-size:28px;font-weight:900;letter-spacing:-.5px}
.od .no{font-size:15px;color:var(--sub);font-weight:700}
.od .ago{margin-left:auto;font-size:14px;font-weight:800;color:var(--sub)}
.od .ago.late{color:var(--bad)}
.od .l{display:flex;gap:10px;font-size:19px;padding:5px 0;font-weight:600}
.od .l b{min-width:34px;font-size:19px;color:var(--accent)}
.od .note{background:var(--warn-soft);color:#8a4b00;border-radius:12px;padding:9px 12px;margin-top:8px;font-weight:700;font-size:16px}
.od .f{display:flex;align-items:center;gap:8px;margin-top:14px}
.od .f .sum{flex:1;font-weight:800;color:var(--sub)}
.od .f .btn{min-height:54px}
.od.done .l{font-size:16px}
.od.done .t{font-size:22px}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:16px;line-height:1.6}
/* 테이블 현황 */
.tgrid{display:flex;flex-wrap:wrap;gap:14px}
.tc{width:calc(25% - 11px);min-width:200px;flex-grow:1;padding:18px;display:flex;flex-direction:column;gap:8px;max-width:calc(50% - 7px)}
.tc .tn{font-size:26px;font-weight:900;display:flex;align-items:center;gap:8px}
.tc.busy{outline:3px solid var(--accent-soft)}
.tc .ls{font-size:15px;color:var(--sub);line-height:1.5;min-height:44px}
.tc .tot{font-size:22px;font-weight:900}
/* 메뉴 관리 */
.mwrap{display:flex;gap:18px;align-items:flex-start}
.mcats{flex:0 0 250px;padding:14px}
.mcats .c{display:flex;align-items:center;gap:6px;padding:6px 0}
.mcats .c input{flex:1;min-width:0;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px}
.mcats .c.on input{border-color:var(--accent);background:var(--accent-soft)}
.ib{width:42px;height:42px;border-radius:12px;background:var(--soft);font-weight:800;flex:0 0 auto}
.mitems{flex:1;min-width:0}
.mi{display:flex;gap:14px;align-items:flex-start;padding:14px;margin-bottom:12px}
.mi .pic{width:96px;height:96px;border-radius:14px;background:var(--soft) center/cover no-repeat;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);font-weight:700;text-align:center;position:relative;overflow:hidden}
.mi .pic input{position:absolute;inset:0;left:0;top:0;width:100%;height:100%;opacity:0}
.mi .fs{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px}
.mi .fs input,.mi .fs select{min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
.mi .fs .nm{flex:2 1 180px} .mi .fs .pr{flex:1 1 110px} .mi .fs .ds{flex:3 1 260px} .mi .fs .ct{flex:1 1 120px}
.chips{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--soft);font-weight:800;font-size:14px;color:var(--sub)}
.chip.on{background:var(--ink);color:#fff}
.chip.sold.on{background:var(--bad);color:#fff}
.chip.best.on{background:var(--accent);color:#fff}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
/* 설정 */
.set{max-width:760px}
.set .card{padding:22px;margin-bottom:16px}
.set h3{margin:0 0 14px;font-size:19px}
.rowt{display:flex;align-items:center;gap:12px;padding:6px 0}
.rowt .tx{flex:1}
.addr{font-size:30px;font-weight:900;letter-spacing:.5px;color:var(--accent);margin:4px 0 8px}
.code{background:var(--soft);border-radius:12px;padding:12px;font-size:14px;word-break:break-all;-webkit-user-select:text;user-select:text}
ol.how{margin:8px 0 0;padding-left:20px;line-height:1.8;color:var(--sub)}
.nokey{max-width:520px;margin:15vh auto;text-align:center;padding:30px}
/* 폴드 펼친 화면 · 폰: 아래 탭 + 한 줄씩 */
@media (max-width:1099px){
  .app{flex-direction:column-reverse}
  .rail{flex:0 0 auto;flex-direction:row;justify-content:space-around;padding:6px 4px;gap:0}
  .rail .logo{display:none}
  .tab{width:auto;flex:1;padding:8px 0;font-size:12px}
  .tab .dot{right:calc(50% - 30px)}
  .seg{display:flex}
  .board .col{display:none;background:transparent;padding:0}
  .board .col.show{display:block}
  .board .col h3{display:none}
  .kpi .hide-n{display:none}
  .mwrap{flex-direction:column}
  .mcats{flex:0 0 auto;width:100%}
  .tc{width:calc(50% - 7px)}
}
@media (max-width:600px){
  .top{padding:10px 14px;gap:10px} .top .ip{display:none} .clock{display:none}
  .view{padding:14px}
  .tc{width:100%;max-width:none}
  .mi{flex-direction:column} .mi .pic{width:100%;height:140px}
}
</style></head>
<body>
<div class="app" id="app">
  <div class="rail">
    <div class="logo">덜</div>
    <button class="tab on" data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>주문<span class="dot hide" id="dNew"></span></button>
    <button class="tab" data-v="tables"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>테이블<span class="dot hide" id="dCall"></span></button>
    <button class="tab" data-v="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>메뉴</button>
    <button class="tab" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
  </div>
  <div class="body">
    <div class="top">
      <div class="shop" id="shop">카운터</div>
      <div class="ip" id="ip"></div>
      <div class="sp"></div>
      <div class="kpi"><div class="hide-n"><small>오늘 주문</small><b id="kCnt">0건</b></div><div><small>오늘 매출</small><b id="kSum">0원</b></div></div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="view" id="vOrders">
      <div class="callbar" id="calls"></div>
      <div class="seg" id="seg"><button data-s="new" class="on">새 주문</button><button data-s="cooking">만드는 중</button><button data-s="done">나간 주문</button></div>
      <div class="board" id="board"></div>
    </div>
    <div class="view hide" id="vTables"><div class="callbar" id="calls2"></div><div class="tgrid" id="tgrid"></div></div>
    <div class="view hide" id="vMenu"></div>
    <div class="view hide" id="vSettings"></div>
  </div>
</div>
<div id="modal"></div>
<script>
var $=function(id){return document.getElementById(id)};
var T=window.TO||null;
var KEY=(T&&T.key?T.key():"")||((location.hash.match(/key=([0-9a-f]+)/)||[])[1]||"");
var D=null,REV=0,view="orders",seg="new",seen={},firstLoad=true,menu=null,menuDirty=false,curMCat="";
var LABEL={"new":"새 주문","cooking":"만드는 중","done":"나간 주문"};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function won(n){return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.parentNode&&d.parentNode.removeChild(d)},2600)}
function api(m,path,body,cb,raw,timeout){var x=new XMLHttpRequest();x.open(m,path,true);x.timeout=timeout||10000;x.setRequestHeader("X-Key",KEY);
  x.onload=function(){var j=null;try{j=JSON.parse(x.responseText)}catch(e){}if(x.status!==200&&j&&j.error)toast(j.error);cb&&cb(x.status,j)};
  x.onerror=x.ontimeout=function(){cb&&cb(0,null)};
  if(raw){x.setRequestHeader("Content-Type","image/jpeg");x.send(raw)}else if(body){x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(body))}else x.send()}
function ago(t){var m=Math.floor((Date.now()-t)/60000);return m<1?"방금":m+"분 전"}
function modal(html){$("modal").innerHTML=html?'<div class="modal"><div class="box">'+html+'</div></div>':"";if(html){var bg=$("modal").firstChild;bg.onclick=function(e){if(e.target===bg)modal()}}}

// ----- 소리 -----
var actx=null;
function ding(){
  if(D&&D.settings&&D.settings.sound===false)return;
  if(T&&T.beep){T.beep();return}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach(function(t,i){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i?1320:880;g.gain.setValueAtTime(.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.35);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.4)})}catch(e){}
}

// ----- 불러오기(바뀌면 바로) -----
function poll(){
  api("GET","/api/admin?rev="+REV,null,function(st,j){
    if(st===200&&j){
      var fresh=[],newCall=false;
      (j.orders||[]).forEach(function(o){if(!seen[o.id]){seen[o.id]=1;if(!firstLoad)fresh.push(o.id)}});
      (j.calls||[]).forEach(function(c){if(!seen[c.id]){seen[c.id]=1;if(!firstLoad)newCall=true}});
      D=j;REV=j.rev;firstLoad=false;
      if(!menuDirty)menu=null;
      draw(fresh);
      if(fresh.length||newCall){ding();if(T&&T.vibrate)T.vibrate(300)}
      setTimeout(poll,30);
    } else if(st===403){ noKey(); }
    else setTimeout(poll,2000);
  },null,30000);
}
function noKey(){$("app").innerHTML='<div class="nokey card"><h2>열쇠가 맞지 않습니다</h2><p class="muted">이 화면은 카운터 기기(사장님 폴드)에서 열거나, 카운터 설정의 "다른 화면에서 열기" 주소로 열어 주세요.</p></div>'}

function draw(fresh){
  var s=D.settings||{};
  $("shop").textContent=s.shop||"카운터";
  var ip=T&&T.ip?T.ip():location.hostname;
  $("ip").innerHTML=ip&&ip!=="127.0.0.1"?'테이블 연결 주소 <b>'+esc(ip)+'</b>':'<b style="color:var(--bad)">와이파이에 연결해 주세요</b>';
  $("kCnt").textContent=(D.todayCount||0)+"건";$("kSum").textContent=won(D.todaySales)+"원";
  var live=(D.orders||[]).filter(function(o){return !o.paid&&o.status!=="canceled"});
  var nNew=live.filter(function(o){return o.status==="new"}).length;
  $("dNew").textContent=nNew;$("dNew").classList.toggle("hide",!nNew);
  $("dCall").textContent=(D.calls||[]).length;$("dCall").classList.toggle("hide",!(D.calls||[]).length);
  drawCalls();
  if(view==="orders")drawBoard(fresh||[]);
  if(view==="tables")drawTables();
  if(view==="menu"&&!menuDirty)drawMenu();
  if(view==="settings"&&!$("vSettings").contains(document.activeElement))drawSettings();
}

function drawCalls(){
  var h="";
  (D.calls||[]).forEach(function(c){h+='<div class="call">🔔 '+c.table+'번 · '+esc(c.what)+' <span style="opacity:.8;font-weight:600">'+ago(c.time)+'</span><button data-c="'+c.id+'">확인</button></div>'});
  $("calls").innerHTML=h;$("calls2").innerHTML=h;
  [].forEach.call(document.querySelectorAll(".call button"),function(b){b.onclick=function(){api("POST","/api/admin/call-done",{id:b.getAttribute("data-c")})}});
}

function orderCard(o,fresh){
  var h='<div class="od '+o.status+(fresh?" fresh":"")+'"><div class="h"><span class="t">'+o.table+'번</span><span class="no">#'+o.no+'</span><span class="ago'+(o.status!=="done"&&Date.now()-o.time>600000?" late":"")+'" data-t="'+o.time+'">'+ago(o.time)+'</span></div>';
  o.items.forEach(function(l){h+='<div class="l"><b>'+l.qty+'</b><span>'+esc(l.name)+'</span></div>'});
  if(o.note)h+='<div class="note">💬 '+esc(o.note)+'</div>';
  h+='<div class="f"><span class="sum">'+won(o.total)+'원</span>';
  if(o.status==="new")h+='<button class="btn ghost" data-a="canceled" data-o="'+o.id+'">취소</button><button class="btn pri" data-a="cooking" data-o="'+o.id+'">만들기 시작</button>';
  else if(o.status==="cooking")h+='<button class="btn ghost" data-a="new" data-o="'+o.id+'">↩</button><button class="btn ok" data-a="done" data-o="'+o.id+'">완료 · 나감</button>';
  else h+='<button class="btn ghost" data-a="cooking" data-o="'+o.id+'">되돌리기</button>';
  return h+'</div></div>';
}
function drawBoard(fresh){
  var live=(D.orders||[]).filter(function(o){return !o.paid&&o.status!=="canceled"});
  var by={"new":[],"cooking":[],"done":[]};
  live.forEach(function(o){by[o.status]&&by[o.status].push(o)});
  by.done.reverse();by.done=by.done.slice(0,30);
  var h="";
  ["new","cooking","done"].forEach(function(k){
    h+='<div class="col c-'+k+(k===seg?" show":"")+'"><h3>'+LABEL[k]+' <span class="n">'+by[k].length+'</span></h3>';
    by[k].forEach(function(o){h+=orderCard(o,fresh.indexOf(o.id)>=0)});
    if(!by[k].length)h+='<div class="empty">'+(k==="new"?"새 주문이 오면 소리와 함께 여기에 나타납니다":k==="cooking"?"만드는 중인 주문이 없습니다":"아직 나간 주문이 없습니다")+'</div>';
    h+='</div>';
  });
  $("board").innerHTML=h;
  [].forEach.call($("seg").querySelectorAll("button"),function(b){var k=b.getAttribute("data-s");b.textContent=LABEL[k]+" "+by[k].length;b.classList.toggle("on",k===seg)});
  [].forEach.call($("board").querySelectorAll("[data-a]"),function(b){b.onclick=function(){
    var a=b.getAttribute("data-a"),id=b.getAttribute("data-o");
    if(a==="canceled"){modal('<h2>이 주문을 취소할까요?</h2><p class="muted">손님 화면과 매출에서 빠집니다.</p><div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" style="flex:1" id="mNo">아니요</button><button class="btn bad" style="flex:1" id="mYes">주문 취소</button></div>');
      $("mNo").onclick=function(){modal()};$("mYes").onclick=function(){modal();api("POST","/api/admin/status",{id:id,status:a})};return}
    b.disabled=true;api("POST","/api/admin/status",{id:id,status:a});
  }});
}
[].forEach.call($("seg").querySelectorAll("button"),function(b){b.onclick=function(){seg=b.getAttribute("data-s");drawBoard([])}});

function drawTables(){
  var n=(D.settings||{}).tables||8,h="";
  for(var t=1;t<=n;t++){
    var os=(D.orders||[]).filter(function(o){return o.table===t&&!o.paid&&o.status!=="canceled"});
    var sum=0,names={};os.forEach(function(o){sum+=o.total;o.items.forEach(function(l){names[l.name]=(names[l.name]||0)+l.qty})});
    var call=(D.calls||[]).filter(function(c){return c.table===t}).length;
    var ls=[];for(var k in names)ls.push(esc(k)+" "+names[k]);
    h+='<div class="tc card'+(os.length?" busy":"")+'"><div class="tn">'+t+'번'+(call?' <span class="badge" style="background:var(--accent);color:#fff">🔔 호출</span>':'')+(os.length?'':' <span class="badge">빈 테이블</span>')+'</div>'+
      '<div class="ls">'+(ls.join(" · ")||"주문 없음")+'</div>'+
      (os.length?'<div class="tot">'+won(sum)+'원</div><button class="btn pri" data-t="'+t+'" data-s="'+sum+'">결제 완료 · 비우기</button>':'')+'</div>';
  }
  $("tgrid").innerHTML=h;
  [].forEach.call($("tgrid").querySelectorAll("[data-t]"),function(b){b.onclick=function(){
    var t=+b.getAttribute("data-t");
    modal('<h2>'+t+'번 테이블 결제 완료</h2><p class="muted">합계 <b style="color:var(--ink);font-size:20px">'+won(+b.getAttribute("data-s"))+'원</b> · 결제를 받으셨으면 테이블을 비웁니다. 손님 화면의 주문 내역도 비워집니다.</p><div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" style="flex:1" id="mNo">닫기</button><button class="btn pri" style="flex:1" id="mYes">결제 완료</button></div>');
    $("mNo").onclick=function(){modal()};$("mYes").onclick=function(){modal();api("POST","/api/admin/clear",{table:t},function(st){if(st===200)toast(t+"번 테이블을 비웠습니다")})};
  }});
}

// ----- 메뉴 관리 -----
function mclone(){return JSON.parse(JSON.stringify({categories:D.categories||[],items:D.items||[]}))}
function rid(){return Math.random().toString(36).slice(2,10)}
function dirty(){menuDirty=true;$("mSave")&&($("mSave").disabled=false)}
function drawMenu(){
  if(!menu)menu=mclone();
  if(!curMCat||!menu.categories.some(function(c){return c.id===curMCat}))curMCat=menu.categories.length?menu.categories[0].id:"";
  var h='<div class="mwrap"><div class="mcats card"><h3 style="margin:4px 4px 10px">분류</h3>';
  menu.categories.forEach(function(c,i){h+='<div class="c'+(c.id===curMCat?" on":"")+'"><input data-ci="'+i+'" value="'+esc(c.name)+'"><button class="ib" data-up="'+i+'">↑</button><button class="ib" data-cdel="'+i+'">✕</button></div>'});
  h+='<button class="btn" style="width:100%;margin-top:8px" id="cAdd">+ 분류 추가</button></div><div class="mitems">';
  var its=menu.items.filter(function(i){return i.cat===curMCat});
  var cname=(menu.categories.filter(function(c){return c.id===curMCat})[0]||{}).name||"";
  h+='<div style="display:flex;align-items:center;gap:10px;margin:2px 0 12px"><h3 style="margin:0;flex:1">'+esc(cname)+' 메뉴 '+its.length+'개</h3><button class="btn pri" id="iAdd">+ 메뉴 추가</button></div>';
  its.forEach(function(it){
    var i=menu.items.indexOf(it);
    h+='<div class="mi card"><div class="pic" style="'+(it.img?'background-image:url('+esc(it.img)+')':'')+'">'+(it.img?'':'사진 넣기')+'<input type="file" accept="image/*" data-pic="'+i+'"></div><div class="fs">'+
      '<input class="nm" data-f="name" data-i="'+i+'" value="'+esc(it.name)+'" placeholder="메뉴 이름">'+
      '<input class="pr" data-f="price" data-i="'+i+'" value="'+it.price+'" inputmode="numeric" placeholder="가격">'+
      '<select class="ct" data-f="cat" data-i="'+i+'">'+menu.categories.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===it.cat?" selected":"")+'>'+esc(c.name)+'</option>'}).join("")+'</select>'+
      '<input class="ds" data-f="desc" data-i="'+i+'" value="'+esc(it.desc||"")+'" placeholder="한 줄 설명 (선택)">'+
      '<div class="chips"><button class="chip sold'+(it.soldout?" on":"")+'" data-sold="'+i+'">품절</button><button class="chip best'+(it.best?" on":"")+'" data-tg="best" data-i="'+i+'">추천</button><button class="chip'+(it.hidden?" on":"")+'" data-tg="hidden" data-i="'+i+'">숨김</button>'+
      '<span style="flex:1"></span><button class="chip" data-mv="'+i+'">↑ 위로</button><button class="chip" data-del="'+i+'" style="color:var(--bad)">삭제</button></div></div></div>';
  });
  if(!its.length)h+='<div class="empty card">이 분류에 메뉴가 없습니다. "+ 메뉴 추가"를 눌러 주세요.</div>';
  h+='<div class="savebar"><span class="muted" style="margin-right:auto">품절은 누르면 바로 손님 화면에 반영됩니다</span><button class="btn ghost" id="mUndo">되돌리기</button><button class="btn pri" id="mSave"'+(menuDirty?'':' disabled')+'>메뉴 저장</button></div></div></div>';
  $("vMenu").innerHTML=h;
  var V=$("vMenu");
  [].forEach.call(V.querySelectorAll("[data-ci]"),function(e){var i=+e.getAttribute("data-ci");
    e.onfocus=function(){if(curMCat!==menu.categories[i].id){curMCat=menu.categories[i].id;drawMenu();var x=V.querySelector('[data-ci="'+i+'"]');x&&x.focus()}};
    e.oninput=function(){menu.categories[i].name=e.value;dirty()}});
  [].forEach.call(V.querySelectorAll("[data-up]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-up");if(i>0){var c=menu.categories.splice(i,1)[0];menu.categories.splice(i-1,0,c);dirty();drawMenu()}}});
  [].forEach.call(V.querySelectorAll("[data-cdel]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-cdel"),c=menu.categories[i];
    var n=menu.items.filter(function(x){return x.cat===c.id}).length;
    if(n){toast("메뉴가 남아 있는 분류는 지울 수 없어요 ("+n+"개)");return}
    menu.categories.splice(i,1);dirty();drawMenu()}});
  $("cAdd").onclick=function(){var c={id:rid(),name:"새 분류"};menu.categories.push(c);curMCat=c.id;dirty();drawMenu()};
  $("iAdd").onclick=function(){if(!curMCat){toast("먼저 분류를 만들어 주세요");return}menu.items.push({id:rid(),cat:curMCat,name:"",price:0,desc:"",img:"",soldout:false,hidden:false,best:false});dirty();drawMenu();var f=V.querySelectorAll(".nm");f.length&&f[f.length-1].focus()};
  [].forEach.call(V.querySelectorAll("[data-f]"),function(e){e.oninput=e.onchange=function(){var i=+e.getAttribute("data-i"),f=e.getAttribute("data-f");
    menu.items[i][f]=f==="price"?(parseInt(e.value.replace(/[^\d]/g,""),10)||0):e.value;dirty();if(f==="cat")drawMenu()}});
  [].forEach.call(V.querySelectorAll("[data-tg]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-i"),f=b.getAttribute("data-tg");menu.items[i][f]=!menu.items[i][f];b.classList.toggle("on",menu.items[i][f]);dirty()}});
  [].forEach.call(V.querySelectorAll("[data-sold]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-sold"),it=menu.items[i];it.soldout=!it.soldout;b.classList.toggle("on",it.soldout);
    if((D.items||[]).some(function(x){return x.id===it.id}))api("POST","/api/admin/soldout",{id:it.id,on:it.soldout},function(st){if(st===200)toast(it.name+(it.soldout?" 품절":" 다시 판매"))});else dirty()}});
  [].forEach.call(V.querySelectorAll("[data-mv]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-mv"),it=menu.items[i];
    for(var j=i-1;j>=0;j--)if(menu.items[j].cat===it.cat){menu.items.splice(i,1);menu.items.splice(j,0,it);dirty();drawMenu();return}}});
  [].forEach.call(V.querySelectorAll("[data-del]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-del");menu.items.splice(i,1);dirty();drawMenu()}});
  [].forEach.call(V.querySelectorAll("[data-pic]"),function(e){e.onchange=function(){var i=+e.getAttribute("data-pic");if(e.files&&e.files[0])photo(e.files[0],function(url){menu.items[i].img=url;dirty();drawMenu()})}});
  $("mUndo").onclick=function(){menu=null;menuDirty=false;drawMenu()};
  $("mSave").onclick=function(){
    for(var i=0;i<menu.items.length;i++)if(!menu.items[i].name.trim()){toast("이름이 빈 메뉴가 있어요");return}
    api("POST","/api/admin/menu",menu,function(st){if(st===200){menuDirty=false;menu=null;toast("메뉴를 저장했습니다. 테이블 화면에 바로 나옵니다")}})};
}
/* 사진은 화면에서 800px로 줄여 올림(테이블 기기가 가볍게 받도록) */
function photo(file,cb){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    c.toBlob(function(b){toast("사진 올리는 중…");api("POST","/api/admin/image",null,function(st,j){if(st===200&&j&&j.img)cb(j.img);else toast("사진을 올리지 못했습니다")},b)},"image/jpeg",.82);
  };im.src=r.result};r.readAsDataURL(file);
}

  '<p class="muted" style="margin-top:14px">덜누름 테이블오더 '+esc(ver)+' · 주문은 이 매장 와이파이 안에서만 오가며, 이 기기에만 저장됩니다.</p></div></div>';
  $("vSettings").innerHTML=h;

  $("sReset").onclick=function(){modal('<h2>오늘 주문을 모두 지울까요?</h2><p class="muted">주문 · 호출 · 매출 기록이 지워지고 주문 번호가 1부터 다시 시작합니다. 메뉴는 그대로입니다.</p><div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" style="flex:1" id="mNo">취소</button><button class="btn bad" style="flex:1" id="mYes">모두 지우기</button></div>');

// ----- 탭 -----
function go(v){
  if(view==="menu"&&v!=="menu"&&menuDirty&&!confirmLeave())return;
  view=v;
  [].forEach.call(document.querySelectorAll(".tab"),function(b){b.classList.toggle("on",b.getAttribute("data-v")===v)});
  ["orders","tables","menu","settings"].forEach(function(k){$("v"+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle("hide",k!==v)});
  if(D){if(v==="orders")drawBoard([]);if(v==="tables")drawTables();if(v==="menu")drawMenu();if(v==="settings")drawSettings()}
}
function confirmLeave(){toast("메뉴를 저장하거나 되돌린 뒤 옮겨 주세요");return false}
[].forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){go(b.getAttribute("data-v"))}});

setInterval(function(){
  var d=new Date();$("clock")&&($("clock").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2));

setInterval(function(){
  if(!D)return;var late=(D.orders||[]).some(function(o){return !o.paid&&o.status==="new"&&Date.now()-o.time>60000});

},30000);
(function(){var d=new Date();$("clock").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)})();

if(!KEY)noKey();else poll();
