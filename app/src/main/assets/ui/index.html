<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>덜누름 패드</title>
  <link rel="stylesheet" href="pad.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <b class="title">덜누름 패드</b>
      <span id="status" class="status">확인 중…</span>
    </header>
    <div id="moveBar" class="movebar" hidden>
      <span>지금 패드가 큰 화면에 떠 있습니다. 휴대폰 화면에서 쓰면 더 편합니다.</span>
      <button id="moveBtn" type="button">휴대폰 화면으로 옮기기</button>
    </div>

    <section class="main">
      <nav id="tabs" class="tabs" aria-label="버튼 판"></nav>
      <main id="grid" class="grid" aria-live="polite"></main>
    </section>

    <aside class="vol" aria-label="볼륨">
      <div class="vol-title"><span>볼륨</span></div>
      <div class="dial-box">
        <svg id="dial" class="dial" viewBox="0 0 240 240" role="slider" aria-label="볼륨" tabindex="0">
          <defs>
            <radialGradient id="brass" cx="38%" cy="32%" r="75%">
              <stop offset="0" stop-color="#f3dda0"/>
              <stop offset=".45" stop-color="#c9a15c"/>
              <stop offset=".8" stop-color="#8c6a33"/>
              <stop offset="1" stop-color="#5e461f"/>
            </radialGradient>
            <radialGradient id="brassRim" cx="50%" cy="50%" r="50%">
              <stop offset=".86" stop-color="#6b5025"/>
              <stop offset=".93" stop-color="#d9bb7a"/>
              <stop offset="1" stop-color="#4b3818"/>
            </radialGradient>
          </defs>
          <g id="ticks"></g>
          <path id="arcBg" fill="none" stroke="rgba(239,227,204,.12)" stroke-width="6" stroke-linecap="round"/>
          <path id="arc" fill="none" stroke="#9be07f" stroke-width="6" stroke-linecap="round"/>
          <circle cx="120" cy="120" r="74" fill="url(#brassRim)"/>
          <circle cx="120" cy="120" r="66" fill="url(#brass)"/>
          <g id="grooves" opacity=".18"></g>
          <line id="pointer" x1="120" y1="58" x2="120" y2="74" stroke="#f8ecd0" stroke-width="4" stroke-linecap="round"/>
          <circle cx="120" cy="120" r="34" fill="#1e1712" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
          <text id="volNum" x="120" y="131" text-anchor="middle" class="vol-num">–</text>
        </svg>
        <div class="vol-steps">
          <button id="volDown" type="button" class="step" aria-label="볼륨 낮추기">−</button>
          <button id="volUp" type="button" class="step" aria-label="볼륨 높이기">+</button>
        </div>
      </div>
      <button id="muteBtn" type="button" class="mute">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path id="muteX" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span id="muteLabel">음소거</span>
      </button>
    </aside>

    <footer class="bottom">
      <p id="hint" class="hint"></p>
      <div class="tools">
        <button id="editBtn" class="ibtn" type="button" aria-label="편집">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z M13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span id="editLabel">편집</span>
        </button>
        <button id="menuBtn" class="ibtn" type="button" aria-label="설정">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div id="menu" class="menu" hidden>
    <button type="button" data-act="keepon"><span>화면 켜 두기</span><i id="keepState">켬</i></button>
    <button type="button" data-act="addboard"><span>판 추가</span></button>
    <button type="button" data-act="reset"><span>기본 판으로 되돌리기</span></button>
    <button type="button" data-act="about"><span>정보</span></button>
  </div>

  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheetBox"></div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="pad.js"></script>
</body>
</html>
