<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>덜누름 덱스</title>
<link rel="stylesheet" href="dex.css">
</head>
<body>
<div id="wall" aria-hidden="true"></div>

<main id="desk" aria-label="바탕화면">
  <ul id="icons" class="icons"></ul>
  <div id="hint" class="hint" hidden></div>
</main>

<!-- 작업 표시줄 -->
<nav id="bar" aria-label="작업 표시줄">
  <div class="bar-left">
    <button class="tb" id="drawerBtn" type="button" aria-label="앱 서랍 (윈도우 키)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="4" y="4" width="4" height="4" rx="1"/><rect x="10" y="4" width="4" height="4" rx="1"/><rect x="16" y="4" width="4" height="4" rx="1"/><rect x="4" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="16" y="10" width="4" height="4" rx="1"/><rect x="4" y="16" width="4" height="4" rx="1"/><rect x="10" y="16" width="4" height="4" rx="1"/><rect x="16" y="16" width="4" height="4" rx="1"/></g></svg>
    </button>
    <button class="tb" id="recentsBtn" type="button" aria-label="최근 앱">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
  </div>
  <ul id="tasks" class="bar-apps" aria-label="고정한 앱과 열린 창"></ul>
  <div class="bar-right">
    <button class="tb pill" id="monitorBtn" type="button" hidden aria-label="연결된 화면">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 20h6M12 16v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="monitorLabel">모니터</span>
    </button>
    <button class="tb" id="setupBtn" type="button" aria-label="덱스 설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button class="tb" id="qsBtn" type="button" aria-label="빠른 설정">
      <span id="netIcon" aria-hidden="true"></span>
      <span id="batIcon" class="bat" aria-hidden="true"></span>
      <span id="batText" class="small"></span>
    </button>
    <button class="tb" id="notiBtn" type="button" aria-label="알림">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <div class="clock" id="clock" aria-live="off"><b id="time"></b><span id="date"></span></div>
  </div>
</nav>

<!-- 앱 서랍 -->
<section id="drawer" class="panel" hidden aria-label="앱 서랍">
  <div class="drawer-head">
    <input id="search" type="search" placeholder="앱 검색" autocomplete="off" aria-label="앱 검색">
  </div>
  <ul id="appGrid" class="grid"></ul>
  <div class="drawer-foot">
    <span class="small dim" id="appCount"></span>
    <button type="button" class="link" id="drawerSetup">덱스 설정</button>
    <button type="button" class="link" id="drawerSettings">안드로이드 설정</button>
  </div>
</section>

<!-- 오른쪽 클릭 · 길게 누르기 메뉴 -->
<div id="menu" class="menu" role="menu" hidden></div>

<!-- 덱스 설정 -->
<section id="setup" class="sheet" hidden aria-label="덱스 설정">
  <header class="sheet-head">
    <img src="dex.png" alt="" width="40" height="40">
    <div><strong>덱스 설정</strong><span class="small dim" id="setupSub"></span></div>
    <button type="button" class="x" id="setupClose" aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="sheet-body" id="setupBody"></div>
</section>

<div id="toast" class="toast" role="status" hidden></div>
<script src="dex.js"></script>
</body>
</html>
