<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>덜누름 데스크</title>
  <link rel="stylesheet" href="./desk.css" />
</head>
<body class="wp-0">
  <div id="desk" aria-label="바탕화면"></div>
  <div id="wlayer" aria-label="위젯"></div>
  <div id="wbar" hidden>
    <b>위젯 편집</b><span>끌어서 옮기고, 모서리로 크기를 바꿉니다</span>
    <button id="wbar-add">위젯 추가</button><button id="wbar-done" class="primary">완료</button>
  </div>
  <div id="snap-preview" hidden></div>
  <div id="windows"></div>

  <section id="start" hidden aria-label="시작 메뉴">
    <div class="start-search">
      <span class="sicon" id="search-icon"></span>
      <input id="search" type="search" placeholder="앱, 설정, 도구 검색" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div class="start-body" id="start-body"></div>
    <div class="start-foot">
      <button class="me" id="me" title="데스크 설정"><span class="me-ava" id="me-ava"></span><span id="me-name">사용자</span></button>
      <button id="btn-power" class="foot-btn" title="전원" aria-label="전원"></button>
    </div>
  </section>
  <!-- 예전 이름의 단추(점검·설정에서 씀) -->
  <div hidden><button id="btn-widgets"></button><button id="btn-desk-settings"></button><button id="btn-sys-settings"></button></div>

  <section id="quick" hidden aria-label="빠른 설정"></section>
  <section id="calfly" hidden aria-label="달력"></section>
  <section id="taskview" hidden aria-label="작업 보기"></section>
  <div id="snapfly" hidden aria-label="창 배치 고르기"></div>
  <div id="assist" hidden aria-label="남은 자리 채우기"></div>
  <section id="splitblock" hidden aria-label="화면 나누기 안내">
    <div class="sb-card">
      <b>덜누름 데스크는 화면 나누기에서 쓰지 않습니다</b>
      <p>바탕화면은 전체 화면으로 두고, 다른 앱을 이 안에서 나눠 띄워 주세요. 앱을 길게 누르면(마우스는 오른쪽 누름) "화면 나눠 열기"가 있습니다.</p>
      <button id="split-exit" class="btn primary">전체 화면으로 돌아가기</button>
    </div>
  </section>
  <section id="wpick" hidden aria-label="위젯 고르기">
    <div class="wpick-head"><b>위젯 추가</b><button id="wpick-close" aria-label="닫기">✕</button></div>
    <div class="start-search"><span class="sicon" id="wsearch-icon"></span><input id="wsearch" type="search" placeholder="위젯·앱 이름으로 찾기" autocomplete="off" autocapitalize="off" spellcheck="false" /></div>
    <div class="start-body" id="wpick-body"></div>
  </section>
  <div id="ctx" hidden role="menu"></div>
  <div id="tip" hidden></div>
  <div id="toast" hidden></div>

  <nav id="taskbar" aria-label="작업 표시줄">
    <div id="tb-left"><button id="tb-widgets" class="tbtn wide" title="위젯"><span id="tb-widgets-ico"></span><span class="tb-label">위젯</span></button></div>
    <div id="tb-center">
      <button id="start-btn" class="tbtn" aria-label="시작" title="시작"><span>덜</span></button>
      <button id="tb-search" class="tbtn" aria-label="검색" title="검색"><span class="sico"></span><span class="tb-label">검색</span></button>
      <button id="tb-taskview" class="tbtn" aria-label="작업 보기" title="작업 보기"></button>
      <div id="task-items"></div>
    </div>
    <div id="tb-right">
      <button id="tray" class="tbtn" aria-label="연결·음량·배터리" title="빠른 설정">
        <span id="tray-net"></span>
        <span id="tray-vol"></span>
        <span id="tray-batt"><i></i><b></b></span>
      </button>
      <button id="tray-clock" class="tbtn" aria-label="시계와 달력"><b id="clock-time">--:--</b><small id="clock-date"></small></button>
      <button id="peek" aria-label="바탕화면 보기" title="바탕화면 보기"></button>
    </div>
  </nav>
  <script src="./desk.js"></script>
</body>
</html>
