</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="맑은 낮 푸른 바다 위를 선회하는 A-1H 스카이레이더 축소 모형의 3D 장면"></canvas>
  <div class="shade"></div>
  <div class="copy" id="copy"><b>대신남 스피드미터!</b><h1>이제 차 안에서 이륙하세요.</h1></div>
</div>
<script src="vendor/three.min.js"></script>
<script>
"use strict";

    eb(0xdcecff, 30, 0.5, 30, 0, 19.5, 0); eb(0x1f5f9f, 30, 0.5, 30, 0, -19, 0); eb(0xf4f8ff, 0.5, 8, 14, 19, 4, 0);

  // ---------- 하늘 · 바다 · 구름 ----------

    "  vec3 c = mix(vec3(0.78,0.90,0.98), vec3(0.36,0.63,0.94), smoothstep(0.0,0.22,h));",
    "  c = mix(c, vec3(0.12,0.36,0.78), smoothstep(0.18,0.75,h));",

      "void main(){ vec3 V = normalize(cameraPosition - vW); float dist = length(cameraPosition - vW);",
      "  vec2 p = vW.xz; float t = uT; float k = 1.0 / (1.0 + dist * 0.004);",
      "  vec2 q = vec2(p.x, p.y * 2.1); float e = 0.9;",

      "  c = mix(c, vec3(1.0,1.0,0.99), smoothstep(0.58,0.82,l));",

    g.position.set(Math.cos(a) * d, (i % 3 === 0 ? -sc * 0.2 : 22 + rnd() * 90), Math.sin(a) * d); g.rotation.y = rnd() * 6.28; g.userData.x0 = g.position.x; scene.add(g); clouds.push(g);
  }

  key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.04; key.shadow.radius = 3;
  var sc0 = key.shadow.camera; sc0.left = -11; sc0.right = 11; sc0.top = 11; sc0.bottom = -11; sc0.near = 20; sc0.far = 110;
  scene.add(key); scene.add(key.target);
  scene.add(new T.HemisphereLight(lin(0xbcd9ff), lin(0x3f78ad), 0.75));
  var rim = new T.DirectionalLight(lin(0xffffff), 0.7); rim.position.set(0.5, 0.55, 0.7); scene.add(rim);

  // ---------- 질감: 패널선과 리벳을 캔버스에 그려 색·요철 지도로 씀 ----------
  var GRAY = "#7f8990", WHITE = "#ecebe6";
  function insignia(x, cx, cy, r, rot) { x.save(); x.translate(cx, cy); x.rotate(rot);

    var W = 2048, H = 2048, c = document.createElement("canvas"), b = document.createElement("canvas"); c.width = b.width = W; c.height = b.height = H;
    var x = c.getContext("2d"), y = b.getContext("2d");
    x.fillStyle = WHITE; x.fillRect(0, 0, W, H); x.fillStyle = GRAY; x.fillRect(W * 0.175, 0, W * 0.65, H);          // 위쪽 회색, 아래쪽 흰색

    y.fillStyle = "#808080"; y.fillRect(0, 0, W, H);
    var rings = [0.06, 0.12, 0.19, 0.27, 0.35, 0.43, 0.50, 0.57, 0.64, 0.70, 0.755, 0.80, 0.815, 0.86, 0.905, 0.93];
    function line(ctx, x0, y0, x1, y1, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
    rings.forEach(function (v) { line(x, 0, gy(v), W, gy(v), "rgba(20,24,30,.42)", 2.5); line(y, 0, gy(v), W, gy(v), "#3c3c3c", 4);
      for (var px = 6; px < W; px += 22) { x.fillStyle = "rgba(20,24,30,.30)"; x.beginPath(); x.arc(px, gy(v) - 9, 1.7, 0, 6.283); x.fill(); y.fillStyle = "#b4b4b4"; y.beginPath(); y.arc(px, gy(v) - 9, 2.2, 0, 6.283); y.fill(); } });
    for (var s = 0; s < 16; s++) { var px = (s + 0.5) / 16 * W; line(x, px, gy(0.80), px, gy(0.03), "rgba(20,24,30,.26)", 2); line(y, px, gy(0.80), px, gy(0.03), "#505050", 3);
      for (var py = gy(0.80); py < gy(0.03); py += 24) { x.fillStyle = "rgba(20,24,30,.22)"; x.beginPath(); x.arc(px + 8, py, 1.5, 0, 6.283); x.fill(); } }

    insignia(x, W * 0.27, gy(0.36), 62, Math.PI / 2); insignia(x, W * 0.73, gy(0.36), 62, -Math.PI / 2);
    var map = new T.CanvasTexture(c), bump = new T.CanvasTexture(b); map.encoding = T.sRGBEncoding; map.anisotropy = bump.anisotropy = 8; return { map: map, bump: bump };
  }
  function panelTile() { var S = 512, c = document.createElement("canvas"); c.width = c.height = S; var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, S, S);
    x.strokeStyle = "rgba(20,24,30,.42)"; x.lineWidth = 3; x.strokeRect(0, 0, S, S); x.strokeStyle = "rgba(20,24,30,.22)"; x.lineWidth = 2; x.beginPath(); x.moveTo(0, S * 0.5); x.lineTo(S, S * 0.5); x.moveTo(S * 0.62, 0); x.lineTo(S * 0.62, S); x.stroke();
    x.fillStyle = "rgba(20,24,30,.26)"; for (var p = 10; p < S; p += 26) { [12, S * 0.5 + 12].forEach(function (q) { x.beginPath(); x.arc(p, q, 2, 0, 6.283); x.fill(); }); x.beginPath(); x.arc(12, p, 2, 0, 6.283); x.fill(); }
    var t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(0.62, 0.62); t.encoding = T.sRGBEncoding; t.anisotropy = 8; return t; }
  var fm = fuselageMaps(), tile = panelTile();
  function paint(c, o) { var p = { color: lin(c), roughness: 0.5, metalness: 0.08, clearcoat: 0.35, clearcoatRoughness: 0.4, envMapIntensity: 0.45 }; for (var k in o) p[k] = o[k]; return new T.MeshPhysicalMaterial(p); }
  var mFus = paint(0xffffff, { map: fm.map, bumpMap: fm.bump, bumpScale: 0.012 });
  var mGray = paint(GRAY, { map: tile }), mWhite = paint(WHITE, { map: tile, roughness: 0.46 });
  var mBare = new T.MeshPhysicalMaterial({ color: lin(0xb9b4ac), metalness: 0.92, roughness: 0.34, envMapIntensity: 0.8 });
  var mDark = new T.MeshPhysicalMaterial({ color: lin(0x232326), metalness: 0.6, roughness: 0.62, envMapIntensity: 0.5 });
  var mExh = new T.MeshPhysicalMaterial({ color: lin(0x3a2c26), metalness: 0.7, roughness: 0.7, emissive: new T.Color(1, 0.32, 0.08), emissiveIntensity: 0 });
  var mGlass = new T.MeshPhysicalMaterial({ color: lin(0x9fd0e2), roughness: 0.05, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.03, transparent: true, opacity: 0.42, envMapIntensity: 1.5, depthWrite: false });

  var mFabric = new T.MeshPhysicalMaterial({ color: lin(0x5a5f48), roughness: 0.95 });

  // ---------- 기체 (기수 +Z, 단위 m: 길이 약 11.8, 날개폭 약 15.2) ----------
  var plane = new T.Group(), body = new T.Group(); plane.add(body); scene.add(plane);
  function add(geo, mat, x, y, z, parent) { var m = new T.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); m.castShadow = true; m.receiveShadow = true; (parent || body).add(m); return m; }
  // 동체: 반지름 곡선을 돌려 만든 회전체(세로로 조금 더 큼)
  var CP = [[-6.6, 0.08], [-5.7, 0.30], [-4.2, 0.54], [-2.5, 0.76], [-0.8, 0.90], [0.8, 0.97], [2.55, 0.98], [2.75, 1.05], [3.95, 1.07], [4.35, 0.95]];

  add(new T.CylinderGeometry(0.3, 0.34, 0.5, 20), mBare, 0, 0, 4.3).rotation.x = Math.PI / 2;
  var exh = []; [-1, 1].forEach(function (s) { for (var q = 0; q < 6; q++) { var ex = add(new T.CylinderGeometry(0.05, 0.06, 0.34, 8), mExh, s * 1.045, -0.42 + q * 0.17, 2.62); ex.rotation.x = Math.PI / 2; exh.push(ex); } });
  // 프로펠러: 네 날, 끝은 노랑. 돌 때는 반투명 원반이 겹쳐 보임
  var prop = new T.Group(); prop.position.z = 4.62; body.add(prop);
  var bs = new T.Shape(); bs.moveTo(-0.09, 0.2); bs.quadraticCurveTo(-0.23, 1.1, -0.13, 1.96); bs.quadraticCurveTo(0, 2.1, 0.13, 1.96); bs.quadraticCurveTo(0.23, 1.1, 0.09, 0.2); bs.closePath();

  for (var b4 = 0; b4 < 4; b4++) { var arm = new T.Group(); arm.rotation.z = b4 * Math.PI / 2; prop.add(arm); var bl = new T.Mesh(bladeGeo, mBlade); bl.rotation.y = 0.5; arm.add(bl);
    var tp = new T.Mesh(new T.BoxGeometry(0.2, 0.13, 0.06), mTip); tp.position.y = 1.96; tp.rotation.y = 0.5; arm.add(tp); }
  add(new T.CylinderGeometry(0.2, 0.24, 0.42, 16), mBare, 0, 0, 0, prop).rotation.x = Math.PI / 2;
  var dc = document.createElement("canvas"); dc.width = dc.height = 256; (function () { var x = dc.getContext("2d"), g = x.createRadialGradient(128, 128, 14, 128, 128, 127);
    g.addColorStop(0, "rgba(20,20,24,0)"); g.addColorStop(0.2, "rgba(20,20,24,.20)"); g.addColorStop(0.86, "rgba(20,20,24,.11)"); g.addColorStop(0.9, "rgba(242,194,48,.55)"); g.addColorStop(0.955, "rgba(242,194,48,.5)"); g.addColorStop(1, "rgba(242,194,48,0)");
    x.fillStyle = g; x.fillRect(0, 0, 256, 256); })();
  var disc = new T.Mesh(new T.CircleGeometry(2.12, 48), new T.MeshBasicMaterial({ map: new T.CanvasTexture(dc), transparent: true, side: T.DoubleSide, depthWrite: false, fog: false })); disc.position.z = 4.63; body.add(disc);

    if (cam.fov !== fov) { cam.fov = fov; cam.updateProjectionMatrix(); }

    sky.position.copy(cam.position); sea.position.set(cam.position.x, 0, cam.position.z);
    for (var i = 0; i < clouds.length; i++) clouds[i].position.x = clouds[i].userData.x0 + t * 0.7;
    copy.style.opacity = sm((t - 1.6) / 1.8) * (1 - sm((t - 19.2) / 0.7)) * (1 - sm((t - 8.1) / 0.4) + sm((t - 16.5) / 0.6));  // 조종석 시점에서는 글자를 치움
