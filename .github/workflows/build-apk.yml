name: Build 덜누름 테이블오더 APK

on:
  push:
    branches: [deolnureum-tableorder]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TableOrder-test.apk

      - name: 서명 키 준비
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 비밀값이 없어 시험용 APK를 올립니다."
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk DeolnureumTableOrder.apk
          ls -la DeolnureumTableOrder.apk TableOrder-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 점검 (주문 서버 · 화면 · 배포용 빌드 실행)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_selftest.sh TableOrder-test.apk ${{ env.VARIANT == 'release' && 'DeolnureumTableOrder.apk' || '' }}

      - name: 점검 기록 올리기 (tableorder-ci 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tableorder-ci --yes --cleanup-tag || true
          gh release create tableorder-ci $(ls tableorder-screen-*.png selftest-result.txt 2>/dev/null) --target "$GITHUB_SHA" --prerelease \
            --title "덜누름 테이블오더 자동 점검 기록" --notes "빌드 ${{ github.run_number }}"

      - name: Releases에 APK 올리기
        if: github.ref == 'refs/heads/deolnureum-tableorder'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tableorder-latest --yes --cleanup-tag || true
          gh release create tableorder-latest DeolnureumTableOrder.apk --target "$GITHUB_SHA" \
            --title "덜누름 테이블오더 (최신 빌드)" --notes "안 쓰는 태블릿은 테이블 주문기, 폴드는 카운터. 빌드 ${{ github.run_number }} ($VARIANT)"

      # 버전별 보관: 사이트의 "내려받기 → 버전 고르기"가 tableorder-v<버전> 릴리스를 씁니다.
      # 이미 있는 버전이면 건드리지 않습니다(사용자에게 나간 파일을 바꾸지 않음). 새 버전은 build.gradle의 versionName을 올리세요.
      - name: 버전별 릴리스 남기기
        if: env.VARIANT == 'release' && github.ref == 'refs/heads/deolnureum-tableorder'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          if gh release view "tableorder-v$VER" >/dev/null 2>&1; then
            echo "tableorder-v$VER 이미 있음 → 그대로 둠"
          else
            cp DeolnureumTableOrder.apk "DeolnureumTableOrder-$VER.apk"
            gh release create "tableorder-v$VER" "DeolnureumTableOrder-$VER.apk" --target "$GITHUB_SHA" --latest=false \
              --title "덜누름 테이블오더 $VER" --notes "$(date -u +%Y-%m-%d -d '+9 hours') · 빌드 ${{ github.run_number }}"
          fi
