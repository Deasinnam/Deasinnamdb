name: Build 덜누름 패드 APK

on:
  push:
    branches: [deolnureum-pad]
  workflow_dispatch:

permissions:
  contents: write

# 연달아 올리면 앞선 빌드를 멈추고 마지막 것만 배포 (배포 순서가 뒤섞이지 않게)
concurrency:
  group: pad-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 앱 버전 읽기
        run: echo "APP_VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 화면 코드 문법 확인
        run: node --check app/src/main/assets/ui/pad.js

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Pad-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 점검 (기본 판 · 저장 · 두 번째 화면에서 앱 열기)
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-build: 16740729
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-audio
          disable-animations: true
          script: bash tools/emulator_selftest.sh Pad-test.apk

      - name: 점검 기록 올리기 (pad-ci 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pad-ci --yes --cleanup-tag || true
          gh release create pad-ci $(find . -maxdepth 1 -size +0 \( -name 'pad-screen-*.png' -o -name 'selftest-*.txt' \) | sort) --target "$GITHUB_SHA" --prerelease \
            --title "덜누름 패드 자동 점검 기록" --notes "빌드 ${{ github.run_number }}"

      - name: 서명 키 준비
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk DeolnureumPad.apk
          cp DeolnureumPad.apk "DeolnureumPad-$APP_VERSION.apk"

      - name: Releases에 APK 올리기 (pad-latest · pad-v<버전>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="덜누름 패드 버전 $APP_VERSION. DeX에 연결한 동안 휴대폰 화면을 버튼 판으로: 버튼을 누르면 앱이 큰 화면에서 열림. 빌드 ${{ github.run_number }} ($VARIANT)"
          gh release delete pad-latest --yes --cleanup-tag || true
          gh release create pad-latest DeolnureumPad.apk --target "$GITHUB_SHA" --title "덜누름 패드 (최신 빌드)" --notes "$NOTES"
          gh release delete "pad-v$APP_VERSION" --yes --cleanup-tag || true
          gh release create "pad-v$APP_VERSION" "DeolnureumPad-$APP_VERSION.apk" --target "$GITHUB_SHA" --title "덜누름 패드 $APP_VERSION" --notes "$NOTES"
