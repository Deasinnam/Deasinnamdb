name: Build 덜누름 덱스 APK

# 사이트에는 올리지 않습니다. 시험용 APK와 점검 기록만 GitHub 미리보기 릴리스(dex-preview · dex-ci)에 남깁니다.
on:
  push:
    branches: [deolnureum-dex]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 화면 코드 문법 확인
        run: node --check app/src/main/assets/ui/dex.js

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Dex-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 점검 (태블릿 · 자유 창 · 가짜 모니터)
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu guest -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_selftest.sh Dex-test.apk

      - name: 점검 기록 올리기 (dex-ci 미리보기 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dex-ci --yes --cleanup-tag || true
          gh release create dex-ci $(find . -maxdepth 1 -size +0 \( -name 'dex-screen-*.png' -o -name selftest-result.txt -o -name logcat-dex.txt -o -name crash.txt -o -name activities.txt \) | sort) --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "덜누름 덱스 자동 점검 기록" --notes "빌드 ${{ github.run_number }}"

      - name: 서명 키 준비
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 시험 배포용 APK
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk DeolnureumDex.apk

      # 사이트 내려받기 표에는 넣지 않습니다. 관리자가 직접 받아 시험하는 미리보기 릴리스입니다.
      - name: 미리보기 릴리스에 APK 올리기 (dex-preview)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          gh release delete dex-preview --yes --cleanup-tag || true
          gh release create dex-preview DeolnureumDex.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "덜누름 덱스 $VER (미리보기 · 사이트 미공개)" --notes "관리자 시험용. 빌드 ${{ github.run_number }} ($VARIANT)"
