name: Build Chat DNR Ai APK

on:
  push:
    branches: [deolnureum-localai]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 여유 공간 만들기 (모델 2.6GB + 에뮬레이터)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk LocalAI-test.apk

      - name: 서명 키 준비
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 비밀값이 없어 시험용 APK를 올립니다."
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk ChatDNRAi.apk
          ls -la ChatDNRAi.apk LocalAI-test.apk

      - name: 점검용 모델 내려받기 (Gemma 4 E2B · 공개 저장소)
        run: |
          curl -fL --retry 5 -o "$RUNNER_TEMP/e2b.litertlm" \
            https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
          ls -la "$RUNNER_TEMP/e2b.litertlm"

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 점검 (진짜 모델로 글 · 사진 질문, 화면)
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          ram-size: 8192M
          disk-size: 14000M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash tools/emulator_selftest.sh LocalAI-test.apk ${{ runner.temp }}/e2b.litertlm

      - name: 점검 기록 올리기 (localai-ci 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete localai-ci --yes --cleanup-tag || true
          gh release create localai-ci $(ls localai-screen-*.png selftest-result.txt logcat-tail.txt 2>/dev/null) --target "$GITHUB_SHA" --prerelease \
            --title "Chat DNR Ai 자동 점검 기록" --notes "빌드 ${{ github.run_number }}"

      - name: Releases에 APK 올리기
        if: github.ref == 'refs/heads/deolnureum-localai'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete localai-android-latest --yes --cleanup-tag || true
          gh release create localai-android-latest ChatDNRAi.apk --target "$GITHUB_SHA" --prerelease \
            --title "Chat DNR Ai 안드로이드 (최신 빌드)" --notes "갤럭시 Z 폴드8 울트라 기준. 빌드 ${{ github.run_number }} ($VARIANT)"

      - name: 버전별 릴리스 남기기
        if: env.VARIANT == 'release' && github.ref == 'refs/heads/deolnureum-localai'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if gh release view "localai-android-v$VER" >/dev/null 2>&1; then
            echo "localai-android-v$VER 이미 있음 → 그대로 둠"
          else
            cp ChatDNRAi.apk "ChatDNRAi-$VER.apk"
            gh release create "localai-android-v$VER" "ChatDNRAi-$VER.apk" --target "$GITHUB_SHA" --latest=false --prerelease \
              --title "Chat DNR Ai 안드로이드 $VER" --notes "$(date -u +%Y-%m-%d -d '+9 hours') · 빌드 ${{ github.run_number }}"
          fi
