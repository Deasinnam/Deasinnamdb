name: Build 덜누름 게임 APK

on:
  push:
    branches: [game-rebuild-0.2]
  workflow_dispatch:

permissions:
  contents: write

# VERSION_ONLY: 'true'이면 예전 버전을 다시 빌드해 game-v<버전> 릴리스만 남깁니다 (game-latest · game-ci는 건드리지 않음)
env:
  VERSION_ONLY: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 화면 코드 문법 확인
        run: node --check app/src/main/assets/ui/game.js

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Game-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 점검 (게임 목록 · 게임 앱 · 도구 · 녹화)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_selftest.sh Game-test.apk

      - name: 점검 기록 올리기 (game-ci 릴리스)
        if: always() && env.VERSION_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete game-ci --yes --cleanup-tag || true
          gh release create game-ci $(find . -maxdepth 1 -size +0 \( -name 'game-screen-*.png' -o -name selftest-result.txt -o -name exit-info.txt -o -name crash-1.txt -o -name logcat-1.txt \) | sort) --target "$GITHUB_SHA" --prerelease \
            --title "덜누름 게임 자동 점검 기록" --notes "빌드 ${{ github.run_number }}"

      - name: 서명 키 준비
        if: github.ref == 'refs/heads/deolnureum-game' || env.VERSION_ONLY == 'true'
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        if: github.ref == 'refs/heads/deolnureum-game' || env.VERSION_ONLY == 'true'
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk DeolnureumGame.apk

      - name: Releases에 APK 올리기
        if: github.ref == 'refs/heads/deolnureum-game' && env.VERSION_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete game-latest --yes --cleanup-tag || true
          gh release create game-latest DeolnureumGame.apk --target "$GITHUB_SHA" \
            --title "덜누름 게임 (최신 빌드)" --notes "게임과 게임 앱을 한곳에: 게임 목록 · 게임 앱 연결 · 게임 녹화 · 게임 최적화. 빌드 ${{ github.run_number }} ($VARIANT)"

      # 버전별 보관: 사이트의 "내려받기 → 버전 고르기"가 game-v<버전> 릴리스를 씁니다.
      # 이미 있는 버전이면 건드리지 않습니다(사용자에게 나간 파일을 바꾸지 않음). 새 버전은 build.gradle의 versionName을 올리세요.
      - name: 버전별 릴리스 남기기
        if: env.VARIANT == 'release' && (github.ref == 'refs/heads/deolnureum-game' || env.VERSION_ONLY == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          if gh release view "game-v$VER" >/dev/null 2>&1; then
            echo "game-v$VER 이미 있음 → 그대로 둠"
          else
            cp DeolnureumGame.apk "DeolnureumGame-$VER.apk"
            gh release create "game-v$VER" "DeolnureumGame-$VER.apk" --target "$GITHUB_SHA" --latest=false \
              --title "덜누름 게임 $VER" --notes "$(date -u +%Y-%m-%d -d '+9 hours') · 빌드 ${{ github.run_number }}"
          fi
