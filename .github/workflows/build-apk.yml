name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 태그 읽기 라이브러리 내장 (오프라인에서도 앨범아트 표시)
        run: curl -fsSL -o app/src/main/assets/jsmediatags.min.js https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: DaesinnamAmp-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Releases에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DaesinnamAmp.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DaesinnamAmp.apk \
            --target "$GITHUB_SHA" \
            --title "Daesinnam Amp (최신 빌드)" \
            --notes "태블릿에서 DaesinnamAmp.apk를 눌러 내려받은 뒤 설치하세요. 빌드 번호 ${{ github.run_number }}"
