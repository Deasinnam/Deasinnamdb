name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 속도계 디자인과 GPS 연동 확인
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 지도 라이브러리 내장 (Leaflet)
        run: |
          mkdir -p app/src/main/assets/leaflet
          curl -fsSL -o app/src/main/assets/leaflet/leaflet.js https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js
          curl -fsSL -o app/src/main/assets/leaflet/leaflet.css https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css

      - name: 태그 읽기 라이브러리 내장 (오프라인에서도 앨범아트 표시)
        run: curl -fsSL -o app/src/main/assets/jsmediatags.min.js https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js

      - name: 서명 키 준비 (GitHub Secrets)
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AMP_KEYSTORE_BASE64" ]; then
            echo "::error::서명 키 비밀값이 없습니다. 저장소 Settings → Secrets and variables → Actions에 AMP_KEYSTORE_BASE64, AMP_KEYSTORE_PASSWORD, AMP_KEY_ALIAS, AMP_KEY_PASSWORD를 등록하세요."
            exit 1
          fi
          echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amp-release.p12"
          echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/amp-release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleLiteRelease assembleFullRelease
          rm -f "$AMP_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v5
        with:
          name: DaesinnamAmp-apk
          path: app/build/outputs/apk/*/release/*.apk

      - name: Releases에 대신남 원 Ver1 APK 올리기
        if: github.ref == 'refs/heads/daesinnam-one-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/lite/release/app-lite-release.apk DaesinnamOne-V1.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk DaesinnamOne-V1-full.apk
          gh release delete one-v1 --yes --cleanup-tag || true
          gh release create one-v1 DaesinnamOne-V1.apk DaesinnamOne-V1-full.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "대신남 원 Ver1 (독립 설치판)" \
            --notes "기존 Daesinnam Amp·데모판과 따로 설치되는 대신남 원 Ver1입니다(패키지 com.daesinnam.one.v1). DaesinnamOne-V1-full.apk는 알림 접근으로 모든 앱의 곡 정보까지 지원하는 풀버전(일반판과 같은 앱이라 서로 덮어 설치). 백업과 비교 테스트용. 콕핏 아날로그 시계, PFD 활주로 이륙·착륙 장면. 빌드 번호 ${{ github.run_number }}"
