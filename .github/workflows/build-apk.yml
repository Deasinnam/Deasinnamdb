name: Build PhotoCraft APK

on:
  push:
    branches: [photocraft-android]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: storytold/photocraft

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: PhotoCraft 공식 웹 빌드 받기 (최신 릴리스)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          echo "PhotoCraft $TAG"
          echo "PC_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PC_VER=${TAG#v}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pc" && cd "$RUNNER_TEMP/pc"
          gh release download "$TAG" -R "$UPSTREAM" --pattern 'photocraft-web-*.zip'
          unzip -q photocraft-web-*.zip
          SITE=$(dirname "$(find . -name index.html -path '*photocraft-web*' | head -1)")
          echo "웹 빌드 폴더: $SITE"
          rm -rf "$GITHUB_WORKSPACE/app/src/main/assets/www"
          cp -r "$SITE" "$GITHUB_WORKSPACE/app/src/main/assets/www"
          ls -la "$GITHUB_WORKSPACE/app/src/main/assets/www" "$GITHUB_WORKSPACE/app/src/main/assets/www/app"
          cp photocraft-web-*.zip "$GITHUB_WORKSPACE/photocraft-web.zip"
          for f in LICENSE-MIT LICENSE-APACHE NOTICE; do gh api "repos/$UPSTREAM/contents/$f?ref=$TAG" -H 'Accept: application/vnd.github.raw' > "$GITHUB_WORKSPACE/app/src/main/assets/www/$f.txt" || true; done

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PphotocraftVersion="$PC_VER"
          cp app/build/outputs/apk/debug/app-debug.apk PhotoCraft-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 자동 점검
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_selftest.sh PhotoCraft-test.apk

      - name: 점검 화면 올리기 (photocraft-ci 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete photocraft-ci --yes --cleanup-tag || true
          gh release create photocraft-ci $(ls photocraft-screen-*.png selftest-result.txt photocraft-web.zip 2>/dev/null) --target "$GITHUB_SHA" --prerelease \
            --title "PhotoCraft 안드로이드 자동 점검 화면" --notes "빌드 서버 에뮬레이터 점검 결과 (빌드 ${{ github.run_number }})"

      - name: 서명 키 준비 (있으면)
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease -PphotocraftVersion="$PC_VER"; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk PhotoCraft.apk
          ls -la PhotoCraft.apk

      - name: Releases에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete photocraft-latest --yes --cleanup-tag || true
          gh release create photocraft-latest PhotoCraft.apk --target "$GITHUB_SHA" \
            --title "PhotoCraft 안드로이드 (최신 빌드)" \
            --notes "PhotoCraft $PC_TAG 공식 웹 빌드를 감싼 비공식 안드로이드판. 빌드 ${{ github.run_number }} ($VARIANT)"
