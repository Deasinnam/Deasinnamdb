name: Build 덜누름 브라우저 APK

on:
  push:
    branches: [deolnureum-browser]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 주소 판단 규칙 점검 (HTTPS 전용 · 유튜브 PC 주소 변환)
        run: |
          mkdir -p "$RUNNER_TEMP/t"
          javac -d "$RUNNER_TEMP/t" app/src/main/java/com/daesinnam/browser/UrlPolicy.java app/src/main/java/com/daesinnam/browser/WebLinkResolver.java tools/UrlRulesTest.java
          java -cp "$RUNNER_TEMP/t" UrlRulesTest

      - name: 받을 파일 이름 규칙 점검 (한글 이름 · 금지 문자 · 확장자)
        run: |
          mkdir -p "$RUNNER_TEMP/d"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/d" app/src/main/java/com/daesinnam/browser/DownloadNames.java tools/DownloadNamesTest.java
          java -Dfile.encoding=UTF-8 -cp "$RUNNER_TEMP/d" DownloadNamesTest

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Browser-test.apk

      - name: 서명 키 준비
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 비밀값이 없어 시험용 APK를 올립니다."
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk DeolnureumBrowser.apk
          ls -la DeolnureumBrowser.apk Browser-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 점검 (화면 배치 · PC 모드 · 배포용 빌드 실행)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_selftest.sh Browser-test.apk ${{ env.VARIANT == 'release' && 'DeolnureumBrowser.apk' || '' }}

      - name: 점검 기록 올리기 (browser-ci 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete browser-ci --yes --cleanup-tag || true
          gh release create browser-ci $(ls browser-screen-*.png selftest-result.txt 2>/dev/null) --target "$GITHUB_SHA" --prerelease \
            --title "덜누름 브라우저 자동 점검 기록" --notes "빌드 ${{ github.run_number }}"

      - name: Releases에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete browser-latest --yes --cleanup-tag || true
          gh release create browser-latest DeolnureumBrowser.apk --target "$GITHUB_SHA" \
            --title "덜누름 브라우저 (최신 빌드)" --notes "언제나 PC 화면으로 여는 가벼운 브라우저. 빌드 ${{ github.run_number }} ($VARIANT)"
