name: Build FilmCraft APK

on:
  push:
    branches: [filmcraft-android]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: storytold/filmcraft

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: FilmCraft 최신 릴리스 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          echo "FilmCraft $TAG"
          echo "FC_TAG=$TAG" >> "$GITHUB_ENV"
          echo "FC_VER=${TAG#v}" >> "$GITHUB_ENV"

      - name: FilmCraft 소스 받기
        uses: actions/checkout@v5
        with:
          repository: storytold/filmcraft
          ref: ${{ env.FC_TAG }}
          path: upstream
          lfs: false

      - name: 안드로이드판 수정 넣기
        run: python3 patches/apply.py upstream

      - name: Rust · wasm 도구 준비
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          rustc --version
          WB=$(grep -oP 'wasm-bindgen = "=\K[0-9.]+' upstream/apps/filmcraft-web/Cargo.toml)
          echo "wasm-bindgen $WB"
          echo "WB_VER=$WB" >> "$GITHUB_ENV"

      - name: wasm-bindgen 캐시
        id: wbcache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ env.WB_VER }}

      - name: wasm-bindgen 설치
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WB_VER" --locked

      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream -> target

      - name: FilmCraft 웹 빌드 (소스에서, 수정 포함)
        run: |
          cd upstream
          cargo xtask web
          ls -la target/web/dist
          W="$GITHUB_WORKSPACE/app/src/main/assets/www"
          rm -rf "$W" && cp -r target/web/dist "$W"
          rm -f "$W/_headers" "$W/.htaccess"
          for f in LICENSE-MIT LICENSE-APACHE NOTICE; do cp "$f" "$W/$f.txt" 2>/dev/null || true; done
          du -sh "$W"

      - name: 크롬에서 웹 빌드 + 연결 스크립트 점검 (시작·가져오기·열기·내보내기·저장)
        run: |
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i --silent puppeteer-core@23 >/dev/null
          cp "$GITHUB_WORKSPACE/tools/web_selftest.mjs" "$RUNNER_TEMP/"
          (cd "$GITHUB_WORKSPACE/app/src/main/assets/www" && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --version
          cd "$GITHUB_WORKSPACE" && node "$RUNNER_TEMP/web_selftest.mjs" http://127.0.0.1:8765/index.html app/src/main/assets/bridge.js

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PfilmcraftVersion="$FC_VER"
          cp app/build/outputs/apk/debug/app-debug.apk FilmCraft-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 자동 점검
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_selftest.sh FilmCraft-test.apk

      - name: 점검 화면 올리기 (filmcraft-ci 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete filmcraft-ci --yes --cleanup-tag || true
          gh release create filmcraft-ci $(ls filmcraft-screen-*.png web-screen-*.png selftest-result.txt 2>/dev/null) --target "$GITHUB_SHA" --prerelease \
            --title "FilmCraft 안드로이드 자동 점검 화면" --notes "빌드 서버 에뮬레이터 점검 결과 (빌드 ${{ github.run_number }})"

      - name: 서명 키 준비 (있으면)
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease -PfilmcraftVersion="$FC_VER"; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk FilmCraft.apk
          ls -la FilmCraft.apk

      - name: Releases에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete filmcraft-latest --yes --cleanup-tag || true
          gh release create filmcraft-latest FilmCraft.apk --target "$GITHUB_SHA" \
            --title "FilmCraft 안드로이드 (최신 빌드)" \
            --notes "FilmCraft $FC_TAG(동영상 편집) 웹 빌드를 감싼 비공식 안드로이드판 (웹에서 H.264 내보내기 수정 포함). 빌드 ${{ github.run_number }} ($VARIANT)"
