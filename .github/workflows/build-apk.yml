name: Build IeumOffice APK

on:
  push:
    branches: [ieumoffice-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 웹 셈 문법 확인
        run: |
          node --check web/shim/electron-shim.js
          node --check web/home/home.js
          test -f app/src/main/assets/www/modules/hwp/index.html

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 서명 키 준비 (있으면)
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 비밀값이 없어 디버그 APK를 만듭니다."
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk IeumOffice.apk
          ls -la IeumOffice.apk

      - uses: actions/upload-artifact@v5
        with:
          name: IeumOffice-apk
          path: IeumOffice.apk

      - name: Releases에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ieumoffice-latest --yes --cleanup-tag || true
          gh release create ieumoffice-latest IeumOffice.apk \
            --target "$GITHUB_SHA" \
            --title "이음오피스 안드로이드 (최신 빌드)" \
            --notes "IeumOffice 0.12.12 안드로이드판 미리보기. 한글(HWP/HWPX)·마크다운·HTML 열기/편집/저장, PDF 보기. 빌드 ${{ github.run_number }} ($VARIANT)"
