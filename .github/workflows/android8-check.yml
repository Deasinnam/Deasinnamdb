name: 안드로이드 8 실행 점검
on:
  push:
    branches: [deolnureum-pad]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q :app:assembleDebug
          cp app/build/outputs/apk/debug/*.apk app.apk
          echo "PKG=$(grep -oP "applicationId '\K[^']+" app/build.gradle)" >> $GITHUB_ENV
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 안드로이드 8 (API 26)에서 켜 보기
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-audio
          script: |
            adb install -r -g app.apk
            adb logcat -c || true
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 > /dev/null || true
            sleep 25
            adb exec-out screencap -p > shot26.png
            adb shell pidof $PKG > pid.txt || true
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' | grep -i -E "$PKG|AndroidRuntime|chromium" | tail -60 > err.txt || true
            echo "PID: $(cat pid.txt)"; echo "== CRASH"; cat crash.txt; echo "== ERR"; cat err.txt
            test -s pid.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke26, path: "shot26.png\ncrash.txt\nerr.txt" }
