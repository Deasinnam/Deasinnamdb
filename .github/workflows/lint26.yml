name: API 26 검사 (NewApi)
on:
  push:
    branches: ['api26-*']
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: lint NewApi
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q :app:lintRelease -Plint26=1 || true
          echo "=== REPORT"; cat app/lint-newapi.txt 2>/dev/null || echo "no report"
