name: localai probe
on:
  push:
    branches: [deolnureum-localai-probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: dump api
        run: |
          cd probe && gradle -q dump | tee ../arts.txt
          cd ..; mkdir x; for f in $(awk '{print $3}' arts.txt); do cp "$f" x/; done; ls -la x
          cd x; for a in *.aar; do mkdir -p "u_$a"; unzip -q -o "$a" -d "u_$a"; done
          find . -name '*.so' | xargs ls -la > ../so.txt || true
          J=$(find . -name classes.jar | head -5); echo "$J"
          for j in $J; do unzip -l "$j" | grep 'litertlm/[A-Za-z]*\.class' | awk '{print $4}' | sed 's/\.class$//;s#/#.#g' >> ../classes.txt; done
          cd ..; CP=$(find x -name classes.jar | tr '\n' ':')
          javap -cp "$CP" $(grep -v '\$' classes.txt | sort -u) > api.txt 2>&1 || true
          javap -cp "$CP" $(grep '\$' classes.txt | sort -u | head -80) >> api_inner.txt 2>&1 || true
          find x -name AndroidManifest.xml -exec cat {} \; > manifests.txt
          ls x/*/ > files.txt; cat x/u_*/proguard.txt > proguard.txt 2>/dev/null || true
      - name: upload
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete localai-probe --yes --cleanup-tag || true
          gh release create localai-probe arts.txt api.txt api_inner.txt classes.txt so.txt manifests.txt proguard.txt --target "$GITHUB_SHA" --prerelease --title "localai probe" --notes probe
