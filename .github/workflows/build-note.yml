name: Build 덜누름 노트 APK

on:
  push:
    branches: [deolnureum-note, 'note-try-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 시험용 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Note-test.apk

      - name: 에뮬레이터 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 점검 (S펜 획 · 손가락 막기 · 지우개 · 저장 · 내보내기 · PDF)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_selftest.sh Note-test.apk

      - name: 점검 기록 올리기 (note-ci 릴리스)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete note-ci --yes --cleanup-tag || true
          gh release create note-ci $(find . -maxdepth 1 -size +0 \( -name 'note-screen-*.png' -o -name 'selftest-*.txt' -o -name crash-1.txt \) | sort) --target "$GITHUB_SHA" --prerelease \
            --title "덜누름 노트 자동 점검 기록" --notes "빌드 ${{ github.run_number }}"

      - name: 서명 키 준비
        if: github.ref == 'refs/heads/deolnureum-note'
        env:
          AMP_KEYSTORE_BASE64: ${{ secrets.AMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMP_KEYSTORE_BASE64" ]; then
            echo "$AMP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "AMP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: 배포용 APK
        if: github.ref == 'refs/heads/deolnureum-note'
        env:
          AMP_KEYSTORE_PASSWORD: ${{ secrets.AMP_KEYSTORE_PASSWORD }}
          AMP_KEY_ALIAS: ${{ secrets.AMP_KEY_ALIAS }}
          AMP_KEY_PASSWORD: ${{ secrets.AMP_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; fi
          rm -f "$RUNNER_TEMP/release.p12"
          cp app/build/outputs/apk/$VARIANT/*.apk DeolnureumNote.apk

      - name: Releases에 APK 올리기
        if: github.ref == 'refs/heads/deolnureum-note'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete note-latest --yes --cleanup-tag || true
          gh release create note-latest DeolnureumNote.apk --target "$GITHUB_SHA" \
            --title "덜누름 노트 (최신 빌드)" --notes "S펜 필기 노트: 펜 · 형광펜 · 지우개(S펜 버튼), 줄 · 모눈 · 점 종이, PDF 위에 쓰기, 그림 · PDF 내보내기. 빌드 ${{ github.run_number }} ($VARIANT)"
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          cp DeolnureumNote.apk "DeolnureumNote-$VER.apk"
          gh release delete "note-v$VER" --yes --cleanup-tag || true
          gh release create "note-v$VER" "DeolnureumNote-$VER.apk" --target "$GITHUB_SHA" --title "덜누름 노트 $VER" \
            --notes "덜누름 노트 버전 $VER. 빌드 ${{ github.run_number }} ($VARIANT)"
